name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 'true' once the signing key is saved in the repository's secrets (see docs/TEST-BUILD.md).
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Honesty check (no fake data, silent failures or dev jargon)
        run: ./scripts/check-honesty.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 36.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null

      - name: Shared rules and shop server tests
        run: ./gradlew :core:test :server:test --no-daemon

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK and shop server package
        run: ./gradlew assembleDebug :server:distZip --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: inscan-server
          path: server/build/distributions/inscan-server.zip

      # The build the shop installs. It is signed with the shop's own key, so each new build
      # installs over the one before it. Skipped on pull requests and until the key is saved.
      - name: Build signed test APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/inscan-release.jks
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0-test.${{ github.run_number }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          ./gradlew :app:assembleRelease --no-daemon
          rm -f "$KEYSTORE_PATH"
          apk="inscan-test-$VERSION_CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Prints who signed it. The SHA-256 line must be the same on every build.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        with:
          name: inscan-test-apk
          path: inscan-test-*.apk
          if-no-files-found: error
