<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InScan Scan</title>
<!--
  InScan Scan screen. Frame: iPhone 17 / 17 Pro, 402 x 874 pt, safe areas drawn. Also fits Android compact (about 412 dp wide).
  Spec: docs/ui-rebuild/scan-pin-ui-spec.md, section 2. The spec wins where this file differs.
  Tokens: inscan-base.css (copied from the locked Home). 1 CSS px = 1 pt / dp.
  The state list on the left is mockup chrome, not app UI. ?shot&state=<key> renders the phone alone.
  Revised after the Phase 4 review (council-review-scan-pin.md).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="inscan-base.css">
<style>
/* Every layer of the Scan screen is positioned on the 402 x 874 frame */
.phone.scan { display: block; }
.phone.scan > * { position: absolute; }

/* Camera picture (placeholder) with our own printed tag, laid out like Label.lines() */
.cam { top: 0; left: 0; right: 0; height: 672px; background: #2B2C2F; overflow: hidden; }
.cam-label { position: absolute; top: 128px; left: 16px; font: var(--type-meta); color: var(--text-2); }
.box { position: absolute; left: 18px; top: 236px; width: 372px; height: 330px; background: #5E5243; rotate: -4deg; border-radius: 4px; }
.printed { position: absolute; left: 56px; top: 78px; width: 256px; height: 128px; background: #FAFAF7; border-radius: 6px; display: flex; gap: 10px; padding: 12px; rotate: 1deg; color: #111; }
.printed .qr { width: 104px; height: 104px; flex: none; }
.printed .qr path { fill: #111; }
.printed .pt { display: flex; flex-direction: column; justify-content: center; gap: 1px; font: 600 12px/15px var(--font-ui); min-width: 0; }
.printed .pt .id { font: 700 13px/16px var(--font-mono); }
.frame-tube { position: absolute; left: -20px; top: 300px; width: 460px; height: 190px; background: #3B3F46; rotate: -3deg; }
.vin-sticker { position: absolute; left: 70px; top: 40px; width: 300px; height: 110px; background: #F4F4F0; border-radius: 4px; padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 6px; color: #111; }
.vin-sticker .bars { width: 100%; height: 60px; }
.vin-sticker .bars path { fill: #111; }
.vin-sticker b { font: 700 16px/20px var(--font-mono); letter-spacing: .06em; text-align: center; }
.cam-tap { position: absolute; inset: 118px 0 0 0; cursor: crosshair; }

.sys-top.over { top: 0; left: 0; right: 0; background: transparent; }
/* Title strip: solid 80% charcoal, no blur. Shows who the scans are logged as. */
.scan-title { top: 62px; left: 0; right: 0; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--over-camera); z-index: 2; }
.scan-title h1 { font: var(--type-section); }
.as { font: var(--type-meta); color: var(--text-2); white-space: nowrap; }

/* Frame: corner brackets, guidance only. After a read they take the outcome's status colour. */
.frame { top: 285px; left: 61px; width: 280px; height: 220px; pointer-events: none; z-index: 2; --bracket: var(--text); }
.frame i { position: absolute; width: 28px; height: 28px; border: 4px solid var(--bracket); transition: border-color var(--dur-sheet) var(--ease-standard); }
.frame .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
.frame .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
.frame .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
.frame .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
.phone[data-tone="good"] .frame { --bracket: var(--good-ink); }
.phone[data-tone="warn"] .frame { --bracket: var(--warn-ink); }
.phone[data-tone="neutral"] .frame { --bracket: var(--neutral-ink); }

.instruction {
  top: 521px; left: 50%; translate: -50% 0; width: max-content; max-width: 360px;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 8px; background: var(--over-camera);
  font: var(--type-body); color: var(--text); z-index: 2;
}
.instruction .ms { color: var(--warn-ink); }
/* Light: built like Home's chip (a small tactile toggle) */
.light {
  top: 608px; left: 16px; height: 48px; padding: 0 16px 0 12px; border-radius: 24px;
  display: inline-flex; align-items: center; gap: 6px; font: var(--type-label); z-index: 2;
  background: var(--surface-raised); border: 1px solid var(--border-strong); box-shadow: var(--chip-shadow);
  transition: transform 90ms var(--ease-out);
}
.light .ms { color: var(--text-2); }
.light:active { background: var(--pressed-fill); box-shadow: var(--pressed-shadow); transform: scale(.985); transition-duration: var(--dur-scale); }
.light[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-tint); }
.light[aria-pressed="true"] .ms { color: var(--accent-ink); font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }

/* Bottom panel: mode switch + Cancel bar (owner's pick). Cancel never moves. */
.scan-panel { left: 0; right: 0; bottom: 0; padding: 12px 16px 50px; background: var(--surface); border-top: 1px solid var(--divider); display: flex; flex-direction: column; gap: 12px; z-index: 5; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { height: 64px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font: var(--type-tile-label); color: var(--text); }
.mode .ms { color: var(--text-2); }
.mode[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-tint); box-shadow: var(--chip-shadow); }
.mode[aria-pressed="true"]::after { opacity: 0; }
.mode[aria-pressed="true"] .ms { color: var(--accent-ink); font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.cancel { height: 64px; border-radius: 12px; display: grid; place-items: center; font: var(--type-tile-label); }
.mode, .cancel { transition: transform 90ms var(--ease-out); }
.mode:active, .cancel:active { transform: scale(.97); transition-duration: var(--dur-scale); }
.sys-bottom.over { left: 0; right: 0; bottom: 0; background: transparent; z-index: 6; }

/* Camera not allowed */
.perm { top: 118px; left: 0; right: 0; height: 554px; padding: 0 16px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; background: var(--bg); z-index: 2; }
.circle { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px; }
.perm .circle { background: var(--neutral-tint); color: var(--neutral-ink); }
.perm h2 { font: var(--type-section); }
.perm p { color: var(--text); max-width: 32ch; }
.perm .btn { margin-top: 12px; width: 100%; }

/* Type it */
.typeit { top: 118px; left: 0; right: 0; height: 254px; padding: 16px; display: none; flex-direction: column; background: var(--bg); z-index: 2; }
.well {
  min-height: 56px; display: flex; align-items: center; gap: 8px;
  padding: 0 14px 0 16px; border-radius: 12px;
  background: var(--well-fill); border: 1px solid var(--border-strong); box-shadow: var(--well-shadow);
  cursor: text;
}
.well:focus-within { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.well input { flex: 1; min-width: 0; height: 54px; background: none; border: 0; outline: none; font: var(--type-field-mono); color: var(--text); text-transform: uppercase; letter-spacing: .04em; }
.well input::placeholder { color: var(--text-2); opacity: 1; font: var(--type-body); letter-spacing: 0; text-transform: none; }
.count { font: var(--type-meta); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.helper { font: var(--type-meta); color: var(--text-2); margin: 8px 0 16px 4px; min-height: 40px; }
.helper.bad { color: var(--text); display: flex; gap: 6px; }
.helper.bad .ms { color: var(--danger-ink); }
.typeit .btn { width: 100%; }
.typeit .text-btn { align-self: center; margin-top: 4px; }
.keyboard { left: 0; right: 0; bottom: 0; height: 334px; padding: 8px 4px 42px; background: #2B2C2F; display: none; flex-direction: column; gap: 10px; z-index: 5; }
.kb-row { display: flex; gap: 6px; justify-content: center; }
.kb-row span { width: 33px; height: 44px; border-radius: 6px; background: #46474B; }
.kb-row .w { width: 88px; } .kb-row .sp { width: 180px; }
.kb-label { text-align: center; font: var(--type-meta); color: var(--text-2); margin-top: 2px; }

/* Result card: slides up over the frozen picture and sits on top of the Cancel bar */
.sheet {
  left: 0; right: 0; bottom: 126px; z-index: 4;
  padding: 16px; background: var(--surface);
  border-top: 1px solid var(--divider); border-radius: 16px 16px 0 0;
  display: none; flex-direction: column; gap: 12px;
  animation: sheet-up var(--dur-sheet) var(--ease-out);
}
@keyframes sheet-up { from { translate: 0 100%; } }
.sheet-head { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.sheet-head .ms { color: var(--text-2); }
.sheet-head h2 { font: var(--type-section); }
.sheet-head h2:focus { outline: none; }
.sheet .rec { padding: var(--space-card) 8px var(--space-card) var(--space-card); }
.sheet .rec-img { width: 96px; min-height: 96px; }   /* 96, not Home's 128: the name needs the width here (review) */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0 4px; }
.facts div { min-width: 0; }
.facts dt { font: var(--type-meta); color: var(--text-2); }
.facts dd { margin: 0; font: var(--type-label); color: var(--text); }
.facts dd.mono { font: var(--type-id); }
.note { display: flex; gap: 8px; align-items: flex-start; font: var(--type-body); color: var(--text); }
.note .ms { margin-top: 0; }
/* Warning notes use the status-banner build (prompt section 5): tint fill, text colour, icon in ink */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; font: var(--type-body); color: var(--text); }
.banner.warn { background: var(--warn-tint); }
.banner.warn .ms { color: var(--warn-ink); }
.vin { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); margin: 0; }
.vin dt { font: var(--type-meta); color: var(--text-2); }
.vin dd { margin: 2px 0 0; font: var(--type-field-mono); letter-spacing: .04em; }
.sheet-actions { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 4px; }
.sheet-actions.one { grid-template-columns: 1fr; }
.sheet-actions .btn { padding: 0 18px; }
.sheet-actions .btn.raised { min-height: 56px; }

/* ----- State wiring ----- */
.phone[data-state="camera"] .instruction .ms,
.phone[data-state="camera"] .instruction .hint-t { display: none; }
.phone[data-state="hint"] .instruction .base-t { display: none; }
.phone:not([data-state="camera"]):not([data-state="hint"]) .instruction,
.phone:not([data-state="camera"]):not([data-state="hint"]) .light,
.phone:not([data-state="camera"]):not([data-state="hint"]) .cam-tap { display: none; }
.phone[data-state="perm"] .perm { display: flex; }
.phone[data-state="perm"] .frame,
.phone[data-typed] .frame,
.phone[data-typed] .cam { display: none; }
.phone[data-typed] .typeit { display: flex; }
.phone[data-state="type"] .keyboard { display: flex; }
.phone[data-state="type"] .scan-panel { bottom: 334px; padding-bottom: 16px; border-bottom: 1px solid var(--divider); }
.phone[data-state="type"] .sys-bottom.over { display: none; }
.phone.has-sheet .sheet { display: flex; }
.phone.has-sheet .modes { display: none; }

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: sheet-fade 120ms linear; }
  @keyframes sheet-fade { from { opacity: 0; } }
  .mode:active, .cancel:active, .light:active { transform: none; }
}
</style>
</head>
<body>
<aside class="panel" aria-label="Mockup states">
  <div>
    <h1>Scan</h1>
    <p class="sub">iPhone 17, 402 x 874 pt. Pick a state, or tap the camera picture to fake a read.</p>
  </div>
  <div class="states" id="states"></div>
  <p class="note" id="route" aria-live="polite"></p>
</aside>
<main class="stage" id="stage"></main>

const READ_ICON = { qr: ["qr_code_2", "Read a QR tag"], vin: ["barcode", "Read a VIN barcode"], typed: ["keyboard", "Typed"] };

const rec = u => `

const head = (st, text) => { const [icon, sr] = READ_ICON[SHEETS[st].read]; return `

const warn = text => `<p class="banner warn">${ic("warning", "ms-20")}<span>${text}</span></p>`;
const btn = (label, attrs, primary) => `<button class="btn ${primary ? "btn-primary" : "raised"}" type="button" ${attrs}>${label}</button>`;
const again = (typed) => btn(typed ? "Type another" : "Scan another", `data-testid="scan.result.again" data-act="${typed ? "type" : "again"}"`);
const row = (...b) => `<div class="sheet-actions${b.length === 1 ? " one" : ""}">${b.join("")}</div>`;

const SHEET = {

    facts([["Colour", "Red"], ["VIN ending", "733158", true], ["Price", "$7,499"]]) +
    row(again()),
  incoming: () => head("incoming", "Found, still Incoming") +
    rec({ ...RANCHER, status: "Incoming", tone: "warn", icon: "package_2" }) +

const TAGS = {

function camContent(st) {

}

        <button class="mode raised" type="button" data-mode="type" data-testid="scan.mode.type" aria-pressed="${typed}">${ic("keyboard")}Type it</button>
      </div>
      <button class="cancel raised" type="button" data-testid="scan.cancel" data-go="back to where Scan was opened">Cancel</button>
    </div>

    <div class="sys-bottom over" aria-hidden="true"></div>
  </div>`;
}

const params = new URLSearchParams(location.search);
if (params.has("shot")) document.body.classList.add("shot");
let state = params.get("state") || location.hash.slice(1) || "camera";
if (!STATES.some(s => s.key === state)) state = "camera";
const stage = document.getElementById("stage");
const route = document.getElementById("route");
let sheetOpenedAt = 0;

function fit() {
  if (document.body.classList.contains("shot")) return;
  const box = stage.querySelector(".fit"); if (!box) return;
  const r = stage.getBoundingClientRect();
  const availH = window.innerWidth > 760 ? window.innerHeight - 48 : Infinity;
  const s = Math.min(1, availH / 874, (r.width - 32) / 402);
  box.style.width = 402 * s + "px"; box.style.height = 874 * s + "px";
  box.firstElementChild.style.transform = `scale(${s})`;
}
function render(focusSheet = false) {
  document.getElementById("states").innerHTML = STATES.map(s => s.group
    ? `<p class="group">${s.group}</p>`
    : `<button type="button" data-state="${s.key}" aria-pressed="${s.key === state}">${s.label}</button>`).join("");
  stage.innerHTML = `<div class="fit">${phoneHTML(state)}</div>`;
  fit();
  try { history.replaceState(null, "", location.search + "#" + state); } catch {}
  if (SHEETS[state]) sheetOpenedAt = performance.now();
  if (focusSheet) stage.querySelector("#sheet-h")?.focus();
  const input = stage.querySelector(".well input");
  if (state === "type" || state === "clash") updateCount(input);
  if (state === "type" && !document.body.classList.contains("shot")) input.focus();
}
function go(next, focusSheet) { state = next; route.textContent = ""; render(focusSheet); }

// Type it: clean the input like ItemId.normalizeShort, strip a leading "ID", never block Look up.
const clean = v => v.toUpperCase().replace(/\s+/g, "").replace(/^ID/, "").replace(/O/g, "0").replace(/[IL]/g, "1");
function updateCount(input) {
  const n = clean(input.value).length;
  const t = input.closest(".typeit");
  t.querySelector(".count").textContent = n <= 8 ? `${n} of 8` : `${n} of 17`;
  t.querySelector("[data-act=lookup]").textContent = n === 8 ? "Look up tag ID" : n === 17 ? "Look up VIN" : "Look up";
  const help = t.querySelector(".helper"); help.classList.remove("bad");
  help.textContent = "The 8 characters after ID on the tag, or the 17‑character VIN.";
}
function lookup() {
  const input = stage.querySelector(".well input"); const v = clean(input.value);
  if (v.startsWith("CATV1;")) { go("incoming", true); return; }   // a Bluetooth scanner typed a whole tag
  if (v.length !== 8 && v.length !== 17) {
    const help = stage.querySelector(".helper"); help.classList.add("bad");
    help.innerHTML = `${ic("error", "ms-20")}<span>Tag IDs have 8 characters, VINs 17. You typed ${v.length}.</span>`;
    return;
  }
  go(v === "7KD2QX4M" ? "clash" : v.length === 17 ? "notfound" : "found", true);
}

document.addEventListener("click", e => {
  const s = e.target.closest(".states button"); if (s) { go(s.dataset.state); return; }
  // Taps in the first 250 ms after a card opens are ignored, so a tap meant for what was there doesn't land on the card.
  if (e.target.closest(".sheet") && performance.now() - sheetOpenedAt < 250) return;
  const m = e.target.closest(".mode"); if (m) { go(m.dataset.mode === "type" ? "type" : "camera"); return; }
  const l = e.target.closest(".light"); if (l) { l.setAttribute("aria-pressed", String(l.getAttribute("aria-pressed") !== "true")); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "read") { navigator.vibrate?.(20); go("incoming", true); }
    if (act === "again") go("camera");
    if (act === "type") go("type");
    if (act === "move") { a.disabled = true; go("moved", true); }   // disabled on the first tap: queued once
    if (act === "lookup") lookup();
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g) route.textContent = `In the app this goes to: ${g.dataset.go}`;
});
document.addEventListener("input", e => { if (e.target.matches(".well input")) updateCount(e.target); });
let wedge = "", wedgeAt = 0;
document.addEventListener("keydown", e => {
  if (e.target.matches(".well input") && e.key === "Enter") { e.preventDefault(); lookup(); return; }
  // Bluetooth scanners type the code and press Enter. In Camera mode, a fast burst ending in Enter counts as a read.
  if (state === "camera" || state === "hint") {
    if (e.key === "Enter" && wedge.length >= 8 && performance.now() - wedgeAt < 400) { wedge = ""; go("incoming", true); return; }
    if (e.key.length === 1) { if (performance.now() - wedgeAt > 80) wedge = ""; wedge += e.key; wedgeAt = performance.now(); }
  }
});
document.addEventListener("touchstart", () => {}, { passive: true });
window.addEventListener("resize", fit);
render();
</script>
</body>
</html>
