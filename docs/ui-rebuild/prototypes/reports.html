<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InScan Reports</title>
<!--
  InScan: More > Reports. Frame: iPhone 17 / 17 Pro, 402 x 874 pt, safe areas drawn.
  Spec: docs/ui-rebuild/reports-ui-spec.md. The spec wins where this file differs.
  Tokens: inscan-base.css. Nav copied from the locked Home (home-a2b1c2.html). 1 CSS px = 1 pt / dp.
  ?shot&state=<key> renders the phone alone. Revised after the Phase 4 review (council-review-reports.md).
  Sample shop matches Home: Incoming 6, In stock 37, Sale pending 2. Today is Fri 30 Oct 2026.
  Charts follow the dataviz method: single series in --data (#8C8F95), status split in the status inks with icon + word.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="inscan-base.css">
<style>
:root {
  --type-nav: 500 14px/16px var(--font-ui);
  --accent-hi: var(--emerald-hi); --accent-lo: var(--emerald-lo);
  --scan-fill: radial-gradient(circle at 50% 22%, var(--accent-hi) 0%, var(--accent) 55%, var(--accent-lo) 100%);
  --scan-shadow: inset 0 2px 0 rgb(255 255 255 / .35), inset 0 -3px 4px rgb(0 0 0 / .25), 0 0 0 4px var(--bg), 0 3px 6px 4px rgb(0 0 0 / .50);
  --scan-pressed-shade: inset 0 -3px 4px rgb(0 0 0 / .25);
  --data: #8C8F95;               /* single-series marks: 5.1:1 on bg, quieter than the figures */
  --data-hi: var(--text);        /* the selected column: 2.9:1 against the others */
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.phone > .sys-top, .phone > .sys-bottom { background: var(--surface); }

/* Top bar: back | title (shown once the big title scrolls under) | Export */
.topbar { flex: none; height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px 0 4px; background: var(--surface); border-bottom: 1px solid var(--divider); }
.topbar .back { justify-self: start; color: var(--accent-ink); }
.bar-title { font: var(--type-app-title); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0; transition: opacity var(--dur-sheet) var(--ease-standard); }
.phone.scrolled .bar-title { opacity: 1; }
.topbar .right { justify-self: end; }
/* Export: built exactly like Home's Find chip */
.exp { height: 48px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px 0 10px; border-radius: 24px; background: var(--surface-raised); border: 1px solid var(--border-strong); box-shadow: var(--chip-shadow); font: var(--type-label); color: var(--text); transition: transform 90ms var(--ease-out); }
.exp .ms { color: var(--accent-ink); }
.exp:active:not(:disabled) { transform: scale(.985); background: var(--pressed-fill); box-shadow: var(--pressed-shadow); }
.exp:disabled { background: var(--surface); border-color: var(--divider); box-shadow: none; color: var(--text-2); }
.exp:disabled .ms { color: var(--text-2); }

.body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 24px; }
.body::-webkit-scrollbar { display: none; }
.title { font: var(--type-screen-title); }
.title:focus { outline: none; }
.hang { font: var(--type-meta); color: var(--text-2); margin-top: -16px; }   /* meta line hanging 8 under the element above */
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec > h2 { font: var(--type-section); }
.foot { font: var(--type-meta); color: var(--text-2); }
.live:empty { display: none; }

/* Filter row */
.filter { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; }
.stepper { min-height: 56px; border-radius: 12px; display: grid; place-items: center; color: var(--text); }
.range { min-height: 56px; border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 16px; text-align: left; }
.range .two { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.range .p { font: var(--type-label); color: var(--text); }
.range .d { font: var(--type-meta); color: var(--text-2); }
.range .ms { color: var(--text-2); }

/* Headline figures: flat tiles, built like Home's count cards (value + word on one baseline) */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tiles.one { grid-template-columns: 1fr; }
.tile { background: var(--surface); border-radius: var(--radius-card); padding: var(--space-card); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tile .val { font: var(--type-big-number); color: var(--text); }
.tile .word { font: var(--type-tile-label); color: var(--text); }
.tile .ctx { font: var(--type-meta); color: var(--text-2); margin-top: 2px; text-wrap: pretty; }

/* Column chart: 44 readout band, 140 plot, 28 day labels */
.chart { position: relative; height: 212px; }
.gl { position: absolute; left: 28px; right: 0; height: 1px; background: var(--divider); }
.tk { position: absolute; left: 0; width: 22px; text-align: right; font: var(--type-meta); color: var(--text-2); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.slots { position: absolute; left: 28px; right: 0; top: 44px; bottom: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.slot { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; border-radius: 8px; }
.slot .col { height: 140px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.slot .bar { width: 24px; border-radius: 4px 4px 0 0; background: var(--data); }
.slot .cap { font: 600 15px/20px var(--font-ui); color: var(--text); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.slot .day { height: 28px; display: grid; place-items: center; font: var(--type-meta); color: var(--text-2); }
.slot.today .day { color: var(--text); font-weight: 600; }
.slot[data-open] .bar { background: var(--data-hi); }
.slot[data-open] .day { color: var(--text); font-weight: 600; }
.chart.has-open .cap { visibility: hidden; }
button.slot:focus-visible { outline-offset: -3px; }
.readout { position: absolute; top: 0; height: 40px; transform: translateX(-50%); white-space: nowrap; padding: 2px 10px; border-radius: 8px; background: var(--surface-raised); border: 1px solid var(--border-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.readout span { font: 400 13px/16px var(--font-ui); color: var(--text-2); }
.readout b { font: 600 15px/18px var(--font-ui); color: var(--text); }

/* Breakdown switch: raised segments; selected = check + weight + accent tint */
.seg { display: grid; gap: 8px; }
.seg button { min-height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 2px; font: var(--type-label); color: var(--text); padding: 0 4px; }
.seg button .tick { display: none; }
.seg button[aria-checked="true"] { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-ink); box-shadow: var(--chip-shadow); font-weight: 600; }
.seg button[aria-checked="true"] .tick { display: inline-block; }
.seg button[aria-checked="true"]::after { opacity: 0; }

/* Flat bordered lists */
.rows { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); overflow: hidden; }
.rows > li + li { border-top: 1px solid var(--divider); }
.row, .brow, .prow { position: relative; isolation: isolate; width: 100%; }
.row::before, .brow::before, .prow::before { content: ""; position: absolute; inset: 0; z-index: var(--z-under); background: var(--surface); opacity: 0; transition: opacity var(--dur-press) var(--ease-standard); }
.row:active::before, .brow:active::before, .prow:active::before { opacity: 1; }
.row:focus-visible, .brow:focus-visible, .prow:focus-visible { outline-offset: -3px; }
.row { min-height: 64px; display: grid; grid-template-columns: 1fr 24px; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
.row .nm { font: var(--type-card-title); display: block; }
.row .fig { font: var(--type-body); color: var(--text); display: flex; align-items: center; gap: 6px; }
.row .fig .ms { color: var(--text-2); }
.row > .ms, .brow .chev, .prow .chev { color: var(--text-2); }

.brow { min-height: 64px; display: grid; grid-template-columns: 1fr 56px 24px; grid-template-rows: auto auto; column-gap: 12px; row-gap: 8px; align-items: center; padding: 12px 12px 12px 16px; }
.brow .bn { grid-column: 1; grid-row: 1; font: var(--type-card-title); min-width: 0; }
.brow .bb { grid-column: 1; grid-row: 2; height: 8px; }
.brow .bb i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--data); }
.brow .num { grid-column: 2; grid-row: 1 / 3; text-align: right; font: var(--type-card-title); font-variant-numeric: tabular-nums; }
.brow .chev { grid-column: 3; grid-row: 1 / 3; }
.brow.flat { grid-template-rows: auto; }
.brow .tag { font: var(--type-card-title); }
/* Status split: the list's first row, not tappable. 8 dp, 2 dp gaps, rounded ends. */
.split-row { padding: 16px; }
.split { display: flex; gap: 2px; height: 8px; }
.split i { display: block; height: 100%; }
.split i:first-child { border-radius: 4px 0 0 4px; }
.split i:last-child { border-radius: 0 4px 4px 0; }
.bg-warn { background: var(--warn-ink); } .bg-good { background: var(--good-ink); } .bg-info { background: var(--info-ink); }

/* Work by person: a list built like a table */
.phead, .prow { display: grid; grid-template-columns: 1fr 64px 72px 52px 24px; column-gap: 8px; align-items: center; }
.phead { padding: 10px 12px 8px 16px; background: var(--surface); font: var(--type-meta); color: var(--text-2); }
.phead span:not(:first-child) { text-align: right; }
.prow { min-height: 56px; padding: 0 12px 0 16px; }
.prow .pn { font: var(--type-card-title); }
.prow .pv { text-align: right; font: var(--type-card-title); font-variant-numeric: tabular-nums; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.notice { padding: 20px 16px; border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.notice p { color: var(--text); }
.notice .sub2 { font: var(--type-meta); color: var(--text-2); }
.notice .btn { margin-top: 12px; }
.busy { display: flex; align-items: center; gap: 8px; font: var(--type-label); color: var(--text); margin-top: -12px; }
.ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--divider); border-top-color: var(--text-2); animation: spin 900ms linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(1turn); } }
.stale { opacity: .5; display: flex; flex-direction: column; gap: 24px; }

/* Bottom navigation (copied from the locked Home) */
.nav { flex: none; position: relative; height: 80px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--divider); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 15px; font: var(--type-nav); color: var(--text-2); }
.nav-pill { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition-property: background-color; transition-duration: var(--dur-press); transition-timing-function: var(--ease-standard); }
.nav-item:active .nav-pill { background: var(--surface-raised); }
.nav-item[aria-current="page"] { color: var(--text); font-weight: 600; }
.nav-item[aria-current="page"] .nav-pill { background: var(--accent-tint); color: var(--accent-ink); box-shadow: var(--chip-shadow); }
.nav-item[aria-current="page"] .nav-pill .ms { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.nav-scan { position: relative; color: var(--text); font-weight: 600; padding-top: 51px; }
.nav-scan:focus-visible { outline: none; }
.nav-scan:focus-visible .scan-btn { outline: 3px solid var(--accent-ink); outline-offset: 3px; }
.scan-btn { position: absolute; top: -17px; left: 50%; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; display: grid; place-items: center; background: var(--scan-fill); color: var(--on-accent); box-shadow: var(--scan-shadow); isolation: isolate; transition: scale var(--dur-press) var(--ease-standard); }
.scan-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: var(--z-under); opacity: 0; background: var(--accent-pressed); box-shadow: var(--scan-pressed-shade); transition: opacity var(--dur-press) var(--ease-standard); }
.nav-scan:active .scan-btn::before { opacity: 1; }
.nav-scan:active .scan-btn { scale: .96; }

/* Sheets */
.scrim { position: absolute; inset: 0; z-index: 8; background: var(--scrim-modal); display: flex; align-items: flex-end; }
.sheet { width: 100%; border-radius: 16px 16px 0 0; background: var(--surface-raised); border-top: 1px solid var(--border-strong); padding: 20px 16px 50px; display: flex; flex-direction: column; gap: 12px; animation: up var(--dur-sheet) var(--ease-out); }
@keyframes up { from { transform: translateY(24px); } }
.sh-head { display: flex; align-items: center; justify-content: space-between; margin: -10px -12px -2px 0; }
.sheet h2 { font: var(--type-section); }
.sheet h2:focus { outline: none; }
.sheet .line { color: var(--text); margin-top: -6px; }
.sheet .note { font: var(--type-meta); color: var(--text-2); }
.sheet .acts { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 4px; }
.sheet .acts .btn.raised { min-width: 112px; }
.opts { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); overflow: hidden; }
.opts > * + * { border-top: 1px solid var(--divider); }
.opt { position: relative; isolation: isolate; width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-align: left; }
.opt:focus-visible { outline-offset: -3px; }
.opt::before { content: ""; position: absolute; inset: 0; z-index: var(--z-under); background: var(--surface-raised); opacity: 0; transition: opacity var(--dur-press) var(--ease-standard); }
.opt:active::before { opacity: 1; }
.opt .two { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.opt .p { font: var(--type-card-title); }
.opt .d { font: var(--type-meta); color: var(--text-2); }
.opt .chk { color: var(--accent-ink); visibility: hidden; }
.opt[aria-current="true"] .chk { visibility: visible; }
.opt .radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; flex: none; }
.opt[aria-checked="true"] .radio { border-color: var(--accent-ink); }
.opt[aria-checked="true"] .radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-ink); }
.custom > .ms { color: var(--text-2); }

@media (prefers-reduced-motion: reduce) {
  .nav-scan:active .scan-btn { scale: 1; }
  .sheet { animation: none; } .bar-title { transition: none; } .ring { animation-duration: 3s; }
}
</style>
</head>
<body>
<aside class="panel" aria-label="Mockup states">
  <div>
    <h1>Reports</h1>
    <p class="sub">iPhone 17, 402 x 874 pt. More, then Reports. Signed in as an Admin. Fri 30 Oct, 9:38 am.</p>
  </div>
  <div class="states" id="states"></div>
  <p class="note" id="route" aria-live="polite"></p>
</aside>
<main class="stage" id="stage"></main>

<script>
const ic = (n, s = "") => `<span class="ms ${s}" aria-hidden="true">${n}</span>`;
const slug = s => s.toLowerCase().replace(/\W+/g, "-").replace(/-$/, "");

const STATES = [
  { group: "Reports list" },
  { key: "list",         label: "Reports" },
  { key: "system",       label: "Shop system (one level down)" },
  { key: "list-loading", label: "First load" },
  { key: "offline",      label: "Offline" },
  { group: "Check-ins (period report)" },
  { key: "checkins",     label: "This week" },
  { key: "checkins-tap", label: "Scrolled, Thursday tapped, by type" },
  { key: "range",        label: "Date range sheet" },
  { key: "refetch",      label: "Updating to last week" },
  { key: "empty",        label: "Nothing today (Saturday, early)" },
  { key: "export",       label: "Export" },
  { key: "drill",        label: "Drill-down: Dale's check-ins" },
  { group: "Snapshot reports" },
  { key: "status",       label: "Units by status" },
  { key: "aging",        label: "Aging" },
  { group: "People" },
  { key: "people",       label: "Work by person" },
];
const SCROLL = { "checkins-tap": 300 };

/* ---- Sample shop ---- */
const LIST = [
  { g: "Inventory", rows: [["Units by status", "37 in stock"], ["Asking price total", "$318,400"], ["Aging", "3 over 90 days"], ["Missing details", "8 units"]] },
  { g: "Intake", rows: [["Check-ins", "14 this week"], ["Time to In stock", "Usually within 2 hours"], ["Tags printed", "17 this week"], ["Tags not confirmed", "5 waiting"]] },
  { g: "Sales", rows: [["Sold", "3 this week"], ["Days to sell", "Usually 38 days"]] },
  { g: "People", rows: [["Work by person", "4 people this week"]] },
  { g: "Shop system", rows: [["Phones, problems and security", "Scans, printing, sign-ins, refused changes", "system"]] },
];
const SYSTEM = [["Phones", "1 not heard from since Tue"], ["Scans", "86 this week"], ["Camera trouble", "1 phone this week"], ["VIN lookups", "Filled everything for 5 of 14"],
  ["Check-ins not finished", "2 this week"], ["Print problems", "1 this week"], ["Sign-in security", "2 lockouts this week", "lock"], ["Refused changes", "3 this week"],
  ["Edited at the same time", "1 this week"], ["Changes not sent for a day", "Not tracked yet"], ["Role changes", "None this month"], ["Exports", "2 this week"]];
const DAYS = [["Mon", "Monday 26 October", 4], ["Tue", "Tuesday 27 October", 2], ["Wed", "Wednesday 28 October", 3], ["Thu", "Thursday 29 October", 1], ["Today", "Friday 30 October", 4], ["Sat", "Saturday 31 October", null], ["Sun", "Sunday 1 November", null]];
const TODAY = 4;
const BREAK = {
  Person: [["Dale", 6], ["Ray", 4], ["Sam", 3], ["Alex", 1]],
  Type:   [["Two wheels", 5], ["Side-by-side", 4], ["Four wheels", 3], ["Snow", 1], ["Water", 1]],
  Make:   [["Polaris", 4], ["Can-Am", 3], ["Honda", 3], ["Yamaha", 2], ["Kawasaki", 1], ["Sea-Doo", 1]],
  Day:    [["Mon 26 Oct", 4], ["Tue 27 Oct", 2], ["Wed 28 Oct", 3], ["Thu 29 Oct", 1], ["Today, Fri 30 Oct", 4]],
};
const STATUS = [["Incoming", "warn", "package_2", 6], ["In stock", "good", "check_circle", 37], ["Sale pending", "info", "hourglass", 2]];
const AGE = [["0 to 30 days", 21], ["31 to 60 days", 11], ["61 to 90 days", 4], ["Over 90 days", 3]];
const OLDEST = [
  { id: "T3MF8ZJB", name: "2025 Can-Am Outlander 570", meta: "Four wheels, in stock since 10 Jun, 142 days", type: "Four wheels" },
  { id: "Q2XH6DNP", name: "2025 Yamaha Grizzly EPS", meta: "Four wheels, in stock since 4 Jul, 118 days", type: "Four wheels" },
  { id: "5C8RJ2MW", name: "2025 Sea-Doo Spark Trixx", meta: "Water, in stock since 25 Jul, 97 days", type: "Water" },
];
const DALE = [   // newest first: 6 units, 4 still Incoming
  { id: "M9PQ4TZE", name: "2026 Polaris Ranger 1000", meta: "Side-by-side, checked in today", type: "Side-by-side", st: "Incoming" },
  { id: "K7RW2PXD", name: "2026 Kawasaki KX112", meta: "Two wheels, checked in today", type: "Two wheels", st: "Incoming" },
  { id: "5NVA9HQC", name: "2026 Polaris Sportsman 570", meta: "Four wheels, checked in Wed", type: "Four wheels", st: "In stock" },
  { id: "3HZW8RTB", name: "2026 Honda FourTrax Rancher 4x4", meta: "Four wheels, checked in Tue", type: "Four wheels", st: "Incoming" },
  { id: "H2CW8VKD", name: "2026 Honda CRF450R", meta: "Two wheels, checked in Mon", type: "Two wheels", st: "In stock" },
  { id: "B4TN7GWS", name: "2026 Yamaha YZ250F", meta: "Two wheels, checked in Mon", type: "Two wheels", st: "Incoming" },
];
const PEOPLE = [["Dale", 6, 4, 3], ["Ray", 4, 3, 1], ["Sam", 3, 2, 0], ["Alex", 1, 0, 2]];
const NAV = [
  { key: "home", label: "Home", icon: "home" }, { key: "stock", label: "Stock", icon: "inventory_2" },
  { key: "scan", label: "Scan", icon: "qr_code_scanner" }, { key: "tickets", label: "Tickets", icon: "build" },
  { key: "more", label: "More", icon: "more_horiz" },
];

/* ---- Pieces ---- */
const navHTML = (inert) => `<nav class="nav" aria-label="Main"${inert}>${NAV.map(n => n.key === "scan"
  ? `<button class="nav-item nav-scan" type="button" data-testid="nav.scan"><span class="scan-btn">${ic(n.icon, "ms-32")}</span>${n.label}</button>`
  : `<button class="nav-item" type="button" data-testid="nav.${n.key}"${n.key === "more" ? ' aria-current="page"' : ""}><span class="nav-pill">${ic(n.icon)}</span>${n.label}</button>`).join("")}</nav>`;
const back = (to, tid, go) => `<button class="text-btn back" type="button" data-testid="${tid}" ${go ? `data-state-go="${go}"` : `data-go="${to}"`}>${ic("chevron_left")}${to}</button>`;
const exportBtn = (on) => on === false
  ? `<button class="exp" type="button" disabled data-testid="report.export">${ic("download", "ms-20")}Export</button>`
  : `<button class="exp" type="button" data-act="export" aria-haspopup="dialog" data-testid="report.export">${ic("download", "ms-20")}Export</button>`;
const title = (t) => `<h1 class="title" id="title" tabindex="-1">${t}</h1>`;
const tile = (val, word, ctx) => `<div class="tile"><span class="head"><span class="val">${val}</span><span class="word">${word}</span></span><span class="ctx">${ctx}</span></div>`;
const live = (txt = "") => `<p class="live busy" role="status" id="live">${txt}</p>`;
const filterRow = (p, d, unit, nextOff = true) => `
  <div class="filter" role="group" aria-label="Date range">
    <button class="stepper raised" type="button" aria-label="Previous ${unit}" data-act="prev" data-testid="report.range.prev">${ic("chevron_left")}</button>
    <button class="range raised" type="button" data-act="range" aria-haspopup="dialog" data-testid="report.range"><span class="two"><span class="p">${p}</span><span class="d">${d}</span></span>${ic("expand_more")}</button>
    <button class="stepper raised" type="button" aria-label="Next ${unit}"${nextOff ? " disabled" : ""} data-testid="report.range.next">${ic("chevron_right")}</button>
  </div>`;

function chart(open) {
  const max = 6, H = 140, top = 44, ticks = [0, 2, 4, 6], W = 370, slotW = (W - 28) / 7;
  const sum = DAYS.filter(d => d[2] != null).map(d => `${d[1].split(" ")[0]} ${d[2]}`).join(", ");
  const o = open >= 0 ? DAYS[open] : null;
  const cx = o ? Math.min(W - 56, Math.max(28 + 56, 28 + (open + .5) * slotW)) : 0;
  return `
  <div class="chart${o ? " has-open" : ""}" role="group" aria-label="Check-ins by day, this week: ${sum}.">
    ${ticks.map(t => `<div class="gl" style="top:${top + H - t / max * H}px" aria-hidden="true"></div><span class="tk" style="top:${top + H - t / max * H}px" aria-hidden="true">${t}</span>`).join("")}
    ${o ? `<div class="readout" aria-hidden="true" style="left:${cx}px"><span>${o[1].replace(/^(\w{3})\w*day (\d+) (\w{3})\w*$/, "$1 $2 $3")}</span><b>${o[2]} check-in${o[2] === 1 ? "" : "s"}</b></div>` : ""}
    <div class="slots">
      ${DAYS.map((d, i) => {
        if (d[2] == null) return `<div class="slot" aria-hidden="true"><div class="col"></div><span class="day">${d[0]}</span></div>`;
        const h = Math.round(d[2] / max * H);
        return `<button class="slot${i === TODAY ? " today" : ""}" type="button"${i === open ? " data-open" : ""} aria-label="${i === TODAY ? "Today, " : ""}${d[1]}, ${d[2]} check-in${d[2] === 1 ? "" : "s"}" data-slot="${i}" data-testid="report.chart.day${i}">
          <span class="col">${i === TODAY ? `<span class="cap" aria-hidden="true">${d[2]}</span>` : ""}<span class="bar" style="height:${h}px"></span></span>
          <span class="day" aria-hidden="true">${d[0]}</span></button>`;
      }).join("")}
    </div>
  </div>`;
}
function seg(keys, sel) {
  return `<div class="seg" role="radiogroup" aria-label="Break down by" style="grid-template-columns:repeat(${keys.length},1fr)">${keys.map(k =>
    `<button class="raised" type="button" role="radio" aria-checked="${k === sel}" data-seg="${k}" data-testid="report.by.${slug(k)}">${ic("check", "ms-20 tick")}${k}</button>`).join("")}</div>`;
}
function brows(rows, noun, goFor) {
  const max = Math.max(...rows.map(r => r[1]));
  return `<ul class="rows">${rows.map(r => `<li><button class="brow" type="button" data-go="${goFor(r[0])}" data-testid="report.row.${slug(r[0])}"
    aria-label="${r[0]}, ${r[1]} ${noun}${r[1] === 1 ? "" : "s"}. Opens the list.">
    <span class="bn">${r[0]}</span><span class="bb" aria-hidden="true"><i style="width:${(r[1] / max * 100).toFixed(1)}%"></i></span>
    <span class="num" aria-hidden="true">${r[1]}</span>${ic("chevron_right", "chev")}</button></li>`).join("")}</ul>`;
}
const ciRows = (k) => brows(BREAK[k], "check-in", n => k === "Person" ? `${n}'s check-ins, this week` : `check-ins this week, ${k.toLowerCase()} ${n}`);
const rec = (u, st) => {
  const s = st || u.st;
  const tag = s === "Incoming" ? `<span class="tag ink-warn">${ic("package_2", "ms-16")}Incoming</span>` : `<span class="tag ink-good">${ic("check_circle", "ms-16")}In stock</span>`;
  return `<button class="rec" type="button" data-go="the unit ${u.id}" data-testid="rec.${u.id}">
    <span class="rec-img" aria-hidden="true">${u.type}</span>
    <span class="rec-body"><span class="rec-line1"><span class="uid">${u.id}</span>${tag}</span>
    <span class="rec-name">${u.name}</span><span class="rec-meta">${u.meta}</span></span>${ic("chevron_right", "rec-chev")}</button>`;
};
const listRows = (rows, loading) => `<ul class="rows">${rows.map(r =>
  `<li><button class="row" type="button" ${r[2] === "system" ? 'data-state-go="system"' : `data-go="the ${r[0]} report"`} data-testid="reports.${slug(r[0])}">
    <span><span class="nm">${r[0]}</span><span class="fig">${loading ? `<span class="ring" aria-hidden="true"></span>Loading…` : r[2] === "lock" ? `${ic("lock", "ms-16")}${r[1]}` : r[1]}</span></span>${ic("chevron_right")}</button></li>`).join("")}</ul>`;

/* ---- Screens ---- */
function listBody(st) {
  if (st === "offline") return `${title("Reports")}
    <div class="notice" role="status"><p>Reports need the shop system.</p><p class="sub2">This phone isn't connected right now. Connect, then try again.</p>
    <button class="btn raised" type="button" data-testid="reports.retry" data-state-go="list">${ic("refresh")}Try again</button></div>`;
  const loading = st === "list-loading";
  return `${title("Reports")}
    <p class="hang">${loading ? "Getting the latest figures." : "Updated 9:38 am"}</p>
    ${LIST.map((g, gi) => `<section class="sec" aria-labelledby="g${gi}"><h2 id="g${gi}">${g.g}</h2>${listRows(g.rows, loading && g.g !== "Shop system")}</section>`).join("")}
    <p class="foot">Each figure says its own range.</p>`;
}
function systemBody() {
  return `${title("Shop system")}<p class="hang">Updated 9:38 am</p>
    ${listRows(SYSTEM, false)}
    <p class="foot">A lock means only people allowed to see that report get the row.</p>`;
}
function checkinsBody(st) {
  if (st === "empty") return `${title("Check-ins")}
    ${filterRow("Today", "Sat 31 Oct", "day", true)}
    <p class="hang">Updated 9:38 am</p>
    <div class="tiles one">${tile("0", "check-ins", "Yesterday: 4")}</div>
    <div class="notice" role="status"><p>No check-ins today, so there's nothing to export.</p><p class="sub2">Step back a day with the arrow, or pick another range.</p></div>`;
  const lw = st === "refetch";
  const by = st === "checkins-tap" ? "Type" : "Person";
  const body = `
    <div class="tiles">${tile("14", "check-ins", "Same days last week: 10")}${tile("8", "in stock", "Of the 14. 6 still Incoming.")}</div>
    <section class="sec" aria-labelledby="h-day"><h2 id="h-day">By day</h2>${chart(st === "checkins-tap" ? 3 : -1)}</section>
    <section class="sec" aria-labelledby="h-brk"><h2 id="h-brk">Breakdown</h2>${seg(["Person", "Type", "Make", "Day"], by)}${ciRows(by)}</section>
    <p class="foot">Counted on the day the work was done, in shop time. A check-in made offline counts on the day it was made.</p>`;
  return `${title("Check-ins")}
    ${lw ? filterRow("Last week", "Mon 19 Oct to Sun 25 Oct", "week", false) : filterRow("This week", "Mon 26 Oct to today", "week", true)}
    ${lw ? live(`<span class="ring" aria-hidden="true"></span>Updating to last week…`) : `<p class="hang">Updated 9:38 am</p>${live()}`}
    ${lw ? `<div class="stale" inert>${body}</div>` : body}`;
}
function drillBody() {
  return `${title("Dale's check-ins")}
    <p class="hang">This week, Mon 26 Oct to today. 6 units, newest first.</p>
    <div class="cards">${DALE.map(u => rec(u)).join("")}</div>`;
}
function statusBody() {
  return `${title("Units by status")}
    <p class="hang">Right now. Updated 9:38 am.</p>
    <div class="tiles">${tile("37", "in stock", "Plus 6 Incoming and 2 Sale pending")}${tile("$318,400", "asking price", "35 of 39 priced. 4 missing a price.")}</div>
    <section class="sec" aria-labelledby="h-brk"><h2 id="h-brk">Breakdown</h2>${seg(["Status", "Type", "Make"], "Status")}
      <ul class="rows">
        <li class="split-row"><div class="split" role="img" aria-label="Of 45 units not sold: Incoming 6, In stock 37, Sale pending 2.">${STATUS.map(s => `<i class="bg-${s[1]}" style="flex:${s[3]}"></i>`).join("")}</div></li>
        ${STATUS.map(s => `<li><button class="brow flat" type="button" data-go="units with status ${s[0]}" data-testid="report.row.${slug(s[0])}" aria-label="${s[0]}, ${s[3]} units. Opens the list.">
          <span class="bn"><span class="tag ink-${s[1]}">${ic(s[2], "ms-20")}${s[0]}</span></span><span class="num" aria-hidden="true">${s[3]}</span>${ic("chevron_right", "chev")}</button></li>`).join("")}
      </ul>
    </section>
    <p class="foot">Asking price adds the prices of units In stock or Sale pending. Units with no price are left out and listed under Missing details.</p>`;
}
function agingBody() {
  return `${title("Aging")}
    <p class="hang">Right now. Updated 9:38 am.</p>
    <div class="tiles">${tile("3", "over 90 days", "Of 39 in stock or Sale pending")}${tile("27", "days typical", "Half of the 39 have been here less")}</div>
    <section class="sec" aria-labelledby="h-brk"><h2 id="h-brk">Breakdown</h2>${seg(["Age", "Status", "Type", "Make"], "Age")}
      ${brows(AGE, "unit", n => `units in stock ${n}, oldest first`)}
    </section>
    <section class="sec" aria-labelledby="h-old"><h2 id="h-old">Oldest in stock</h2><div class="cards">${OLDEST.map(u => rec(u, "In stock")).join("")}</div></section>
    <p class="foot">Days count from when a unit first went In stock. Old stock starts at 90 days, a Shop setting.</p>`;
}
function peopleBody() {
  return `${title("Work by person")}
    ${filterRow("This week", "Mon 26 Oct to today", "week", true)}
    <p class="hang">Updated 9:38 am</p>${live()}
    <div class="tiles">${tile("4", "people", "Same days last week: 4")}${tile("14", "check-ins", "Same days last week: 10")}</div>
    <section class="sec" aria-labelledby="h-tbl"><h2 id="h-tbl">This week, by person</h2>
      <div class="rows">
        <div class="phead" aria-hidden="true"><span>Person</span><span>Check-ins</span><span>Moved to In stock</span><span>Edits</span><span></span></div>
        <ul>${PEOPLE.map(p => `<li style="border-top:1px solid var(--divider)"><button class="prow" type="button" data-go="${p[0]}'s work this week" data-testid="people.${slug(p[0])}"
          aria-label="${p[0]}: ${p[1]} check-ins, ${p[2]} moved to In stock, ${p[3]} edits. Opens ${p[0]}'s work.">
          <span class="pn">${p[0]}</span><span class="pv" aria-hidden="true">${p[1]}</span><span class="pv" aria-hidden="true">${p[2]}</span><span class="pv" aria-hidden="true">${p[3]}</span>${ic("chevron_right", "chev")}</button></li>`).join("")}</ul>
      </div>
    </section>
    <p class="foot">Moved to In stock counts tag confirms done this week, including units checked in earlier. Edits count changes to unit details.</p>`;
}

function rangeSheet() {
  const P = [["Today", "Fri 30 Oct"], ["This week", "Mon 26 Oct to today"], ["Last week", "Mon 19 Oct to Sun 25 Oct"], ["This month", "1 Oct to today"], ["Last 30 days", "1 Oct to 30 Oct"]];
  return `<div class="scrim" data-dismiss><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h">
    <div class="sh-head"><h2 id="sh-h" tabindex="-1">Date range</h2><button class="text-btn" type="button" data-act="close" data-testid="range.close">Close</button></div>
    <div class="opts">${P.map(p => `<button class="opt" type="button"${p[0] === "This week" ? ' aria-current="true"' : ""} data-testid="range.${slug(p[0])}" data-act="pick">
      <span class="two"><span class="p">${p[0]}</span><span class="d">${p[1]}</span></span>${ic("check", "chk")}</button>`).join("")}</div>
    <div class="opts"><button class="opt custom" type="button" data-testid="range.custom" data-go="a full-screen date range picker (Material 3 DateRangePicker)">${ic("calendar_month")}<span class="two"><span class="p">Custom dates…</span></span>${ic("chevron_right")}</button></div>
    <p class="note">Weeks start Monday. Times are shop time (Pacific).</p>
  </section></div>`;
}
function exportSheet() {
  return `<div class="scrim" data-dismiss><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h" aria-describedby="sh-line">
    <h2 id="sh-h" tabindex="-1">Export check-ins</h2>
    <p class="line" id="sh-line">This week, Mon 26 Oct to Fri 30 Oct.</p>
    <div class="opts" role="radiogroup" aria-label="What to export">
      <button class="opt" type="button" role="radio" aria-checked="true" data-testid="export.each"><span class="radio" aria-hidden="true"></span><span class="two"><span class="p">Each check-in</span><span class="d">14 rows. One line per unit, for sorting and filtering.</span></span></button>
      <button class="opt" type="button" role="radio" aria-checked="false" data-testid="export.table"><span class="radio" aria-hidden="true"></span><span class="two"><span class="p">This table</span><span class="d">4 rows. The breakdown on screen, by person.</span></span></button>
    </div>
    <p class="note">The file includes names and prices. Send it to yourself; don't save it on a shared phone.</p>
    <div class="acts"><button class="btn raised" type="button" data-act="close" data-testid="export.cancel">Cancel</button><button class="btn btn-primary" type="button" data-testid="export.go" data-go="the phone's share sheet with inscan-check-ins-2026-10-26-to-2026-10-30.csv">${ic("ios_share")}Share file</button></div>
  </section></div>`;
}

function phoneHTML(st) {
  const sheet = st === "range" || st === "export", inert = sheet ? " inert" : "";
  const isList = ["list", "list-loading", "offline"].includes(st);
  const top = isList ? back("More", "reports.back") : st === "system" ? back("Reports", "system.back", "list")
    : st === "drill" ? back("Check-ins", "drill.back", "checkins") : back("Reports", "report.back", "list");
  const name = { system: "Shop system", drill: "Dale's check-ins", status: "Units by status", aging: "Aging", people: "Work by person" }[st] || (isList ? "Reports" : "Check-ins");
  const right = isList || st === "system" || st === "drill" ? "" : st === "empty" ? exportBtn(false) : exportBtn(true);
  const body = isList ? listBody(st) : st === "system" ? systemBody() : st === "drill" ? drillBody() : st === "status" ? statusBody()
    : st === "aging" ? agingBody() : st === "people" ? peopleBody() : checkinsBody(sheet ? "checkins" : st);
  return `
  <div class="phone" data-state="${st}">
    <div class="sys-top" aria-hidden="true"><span>9:41</span><span class="island"></span><span>100%</span></div>
    <header class="topbar"${inert}>${top}<span class="bar-title" aria-hidden="true">${name}</span><span class="right">${right}</span></header>
    <main class="body" id="body"${inert}>${body}</main>
    ${navHTML(inert)}
    <div class="sys-bottom" aria-hidden="true"></div>
    ${st === "range" ? rangeSheet() : st === "export" ? exportSheet() : ""}
  </div>`;
}

/* ---- Mockup frame ---- */
const params = new URLSearchParams(location.search);
if (params.has("shot")) document.body.classList.add("shot");
let state = params.get("state") || location.hash.replace(/^#s-/, "") || "list";
if (!STATES.some(s => s.key === state)) state = "list";
const stage = document.getElementById("stage"), route = document.getElementById("route");
function fit() {
  if (document.body.classList.contains("shot")) return;
  const box = stage.querySelector(".fit"); if (!box) return;
  const r = stage.getBoundingClientRect();
  const availH = window.innerWidth > 760 ? window.innerHeight - 48 : Infinity;
  const s = Math.min(1, availH / 874, (r.width - 32) / 402);
  box.style.width = 402 * s + "px"; box.style.height = 874 * s + "px";
  box.firstElementChild.style.transform = `scale(${s})`;
}
function watchScroll() {   // the bar title appears once the big title is under the bar
  const b = stage.querySelector("#body"), t = stage.querySelector("#title"), phone = stage.querySelector(".phone");
  const upd = () => phone.classList.toggle("scrolled", !!t && b.scrollTop > t.offsetTop + t.offsetHeight - 16);
  b.addEventListener("scroll", upd, { passive: true }); upd();
}
function render(focusSel) {
  document.getElementById("states").innerHTML = STATES.map(s => s.group ? `<p class="group">${s.group}</p>`
    : `<button type="button" data-state="${s.key}" aria-pressed="${s.key === state}">${s.label}</button>`).join("");
  stage.innerHTML = `<div class="fit">${phoneHTML(state)}</div>`;
  fit();
  const b = stage.querySelector("#body"); if (SCROLL[state]) b.scrollTop = SCROLL[state];
  watchScroll();
  try { history.replaceState(null, "", location.search + "#s-" + state); } catch {}
  if (focusSel !== false && !document.body.classList.contains("shot"))
    stage.querySelector(focusSel || (state === "range" || state === "export" ? "#sh-h" : "#title"))?.focus({ preventScroll: true });
}
function go(next, focusSel) { state = next; route.textContent = ""; render(focusSel); }
const closeSheet = () => go("checkins", state === "export" ? '[data-testid="report.export"]' : '[data-testid="report.range"]');
document.addEventListener("click", e => {
  const s = e.target.closest(".states button"); if (s) { go(s.dataset.state); return; }
  const slot = e.target.closest("button.slot");
  if (slot) { const i = +slot.dataset.slot, open = slot.hasAttribute("data-open"); const keep = stage.querySelector("#body").scrollTop;
    stage.querySelector(".chart").outerHTML = chart(open ? -1 : i);
    stage.querySelector("#body").scrollTop = keep; stage.querySelector(`[data-slot="${i}"]`)?.focus(); return; }
  const sg = e.target.closest(".seg button");
  if (sg) { sg.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", String(b === sg)));
    const k = sg.dataset.seg, ul = sg.parentElement.nextElementSibling; if (BREAK[k] && ul?.matches("ul.rows")) ul.outerHTML = ciRows(k); return; }
  const opt = e.target.closest(".opt[role=radio]");
  if (opt) { opt.parentElement.querySelectorAll("[role=radio]").forEach(o => o.setAttribute("aria-checked", String(o === opt))); return; }
  const a = e.target.closest("[data-act]");
  if (a) { const act = a.dataset.act;
    if (act === "range") go("range"); if (act === "export") go("export"); if (act === "close") closeSheet();
    if (act === "pick") go(a.dataset.testid === "range.last-week" ? "refetch" : "checkins", '[data-testid="report.range"]');
    if (act === "prev") go("refetch", '[data-testid="report.range.prev"]'); return; }
  const sgo = e.target.closest("[data-state-go]"); if (sgo) { go(sgo.dataset.stateGo); return; }
  const g = e.target.closest("[data-go]"); if (g) { route.textContent = `In the app this goes to: ${g.dataset.go}`; return; }
  if (e.target.matches("[data-dismiss]")) closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (state === "range" || state === "export")) closeSheet(); });
document.addEventListener("touchstart", () => {}, { passive: true });
window.addEventListener("resize", fit);
render(false);
</script>
</body>
</html>
