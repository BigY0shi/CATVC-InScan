<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InScan Check in</title>
<!--
  InScan: check in a unit and print its tag. Frame: iPhone 17 / 17 Pro, 402 x 874 pt, safe areas drawn.
  Spec: docs/ui-rebuild/checkin-ui-spec.md. The spec wins where this file differs.
  Tokens: inscan-base.css. 1 CSS px = 1 pt / dp. The state list on the left is mockup chrome.
  ?shot&state=<key> renders the phone alone. The system keyboard is drawn on one state only (Make & model).
  Revised after the Phase 4 review (council-review-checkin.md). Sample VIN 4XARR45DXT8104217 is made up and
  passes the check digit; the lookup result shown is partial on purpose (NHTSA often returns make and year only
  for off-road units). The tag QR is real (LabelPayload format), generated, not drawn.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="inscan-base.css">
<style>
.phone > .sys-top { background: var(--surface); }
.phone > .sys-bottom { background: var(--surface); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Top bar: Cancel / Print later / Done, title, step count */
.ci-top { flex: none; height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px 0 4px; background: var(--surface); }
.ci-top h1 { font: var(--type-section); text-align: center; }
.ci-top .text-btn { justify-self: start; }
.ci-step { justify-self: end; font: var(--type-meta); color: var(--text-2); padding-right: 8px; }
/* Progress is status, not an action: text-2 fill on the divider track, animated with transform */
.progress { flex: none; height: 4px; background: var(--divider); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--text-2); transform-origin: left; transition: transform var(--dur-sheet) var(--ease-standard); }

.body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 24px; }
.body::-webkit-scrollbar { display: none; }
.head { display: flex; flex-direction: column; gap: 4px; }
.step-h { font: var(--type-screen-title); }
.step-h:focus { outline: none; }
.help { color: var(--text-2); }
.group { display: flex; flex-direction: column; gap: 8px; }

/* Fields: inset wells */
.field-label { font: var(--type-label); color: var(--text); }
.opt { color: var(--text-2); font-weight: 400; }
.well { min-height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 16px; border-radius: 12px; background: var(--well-fill); border: 1px solid var(--border-strong); box-shadow: var(--well-shadow); cursor: text; }
.well:focus-within { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.well[data-invalid] { border-color: var(--warn-ink); box-shadow: var(--well-shadow), 0 0 0 2px var(--warn-ink); }
.well[data-missing] { border-color: var(--danger-ink); box-shadow: var(--well-shadow), 0 0 0 2px var(--danger-ink); }
.well input, .well textarea { flex: 1; min-width: 0; background: none; border: 0; outline: none; font: var(--type-body); color: var(--text); padding: 0; }
.well input { height: 54px; }
.well textarea { resize: none; padding: 14px 0; min-height: 84px; }
.well input::placeholder, .well textarea::placeholder { color: var(--text-2); opacity: 1; }
.well.mono input { font: var(--type-field-mono); letter-spacing: .04em; text-transform: uppercase; }
.well.mono input::placeholder { text-transform: none; font: var(--type-body); letter-spacing: 0; }
.well .prefix { font: var(--type-body); color: var(--text-2); }
.under { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 24px; }
.count { font: var(--type-meta); color: var(--text-2); font-variant-numeric: tabular-nums; padding-left: 4px; }
.under .text-btn { margin: -12px -12px -12px 0; }
.marker { display: inline-flex; align-items: center; gap: 4px; font: var(--type-meta); color: var(--text-2); padding-left: 4px; }
.marker .ms { color: var(--info-ink); }
.missing { display: flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--text); padding-left: 4px; }
.missing .ms { color: var(--danger-ink); }

/* Full-width raised action row (Scan the VIN barcode) */
.wide { width: 100%; min-height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font: var(--type-tile-label); transition: transform 90ms var(--ease-out); }
.wide .ms { color: var(--accent-ink); }
.wide:active { transform: scale(.97); transition-duration: var(--dur-scale); }

/* VIN / Serial number switch: same build as Scan's mode tiles, 48 tall */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font: var(--type-label); color: var(--text); }
.seg button[aria-checked="true"] { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-tint); box-shadow: var(--chip-shadow); }
.seg button[aria-checked="true"]::after { opacity: 0; }

/* Quick-pick chips: raised; selected adds a check and an accent-ink border, so it isn't colour alone */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { position: relative; isolation: isolate; min-height: 48px; padding: 0 16px; border-radius: 24px; display: inline-flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--text);
  background: var(--surface-raised); border: 1px solid var(--border-strong); box-shadow: var(--chip-shadow); transition: transform 90ms var(--ease-out); }
.qchip::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: var(--z-under); background: var(--pressed-fill); box-shadow: var(--pressed-shadow); opacity: 0; transition: opacity var(--dur-press) var(--ease-standard); }
.qchip:active::before { opacity: 1; }
.qchip:active { transform: scale(.985); transition-duration: var(--dur-scale); }
.qchip[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-ink); padding-left: 10px; }
.qchip .tick { display: none; }
.qchip[aria-pressed="true"] .tick { display: inline-block; }
.qchip .ms { color: inherit; }

/* Results */
.line { display: flex; gap: 8px; align-items: flex-start; font: var(--type-body); color: var(--text); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; font: var(--type-body); color: var(--text); }
.banner.warn { background: var(--warn-tint); } .banner.warn > .ms { color: var(--warn-ink); }
.lookup { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.lookup .lk-h { display: flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--text-2); }
.lookup .lk-h .ms { color: var(--info-ink); }
.lookup dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; }
.lookup dt { font: var(--type-meta); color: var(--text-2); }
.lookup dd { margin: 0; font: var(--type-label); }
.lookup .nf { font: var(--type-meta); color: var(--text-2); }
.check-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 4px; font: var(--type-body); cursor: pointer; }
.check-row input { appearance: none; width: 28px; height: 28px; margin: 0; border-radius: 6px; border: 2px solid var(--border-strong); background: var(--well-fill); display: grid; place-items: center; flex: none; cursor: pointer; }
.check-row input:checked { background: var(--accent-tint); border-color: var(--accent-ink); }
.check-row input:checked::after { content: "check"; font-family: "Material Symbols Rounded"; font-size: 22px; color: var(--accent-ink); }
.check-row input:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }

/* Type cards: raised; selected is latched like Scan's mode tile, not a focus-style outline */
.types { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12px; }
.type-card { position: relative; border-radius: 12px; display: flex; flex-direction: column; text-align: left; transition: transform 90ms var(--ease-out); }
.type-card:active { transform: scale(.97); transition-duration: var(--dur-scale); }
.type-card .img { height: 92px; margin: 8px 8px 0; border-radius: var(--radius-img); display: grid; place-items: center; text-align: center; font: var(--type-meta); color: var(--text-2); outline: 1px dashed var(--border-strong); outline-offset: -1px; }
.type-card .name { min-height: 44px; display: flex; align-items: center; margin: 8px; padding: 0 8px; border-radius: 8px; font: var(--type-tile-label); }
.type-card[aria-checked="true"] { box-shadow: var(--chip-shadow); }
.type-card[aria-checked="true"]::after { opacity: 0; }
.type-card[aria-checked="true"] .name { background: var(--accent-tint); color: var(--accent-ink); }
.type-card .badge-check { position: absolute; top: 14px; right: 14px; display: none; color: var(--accent-ink); }
.type-card[aria-checked="true"] .badge-check { display: block; }

/* Review: flat rows, the whole row opens its step; Edit trails */
.review { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); }
.rv { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; min-height: 64px; padding: 10px 4px 10px 16px; border-bottom: 1px solid var(--divider); text-align: left; position: relative; isolation: isolate; }
.rv:last-child { border-bottom: 0; }
.rv::before { content: ""; position: absolute; inset: 0; z-index: var(--z-under); background: var(--surface); opacity: 0; transition: opacity var(--dur-press) var(--ease-standard); }
.rv:active::before { opacity: 1; }
.rv .thumb { width: 48px; height: 36px; border-radius: 6px; outline: 1px dashed var(--border-strong); outline-offset: -1px; display: grid; place-items: center; font: 500 10px/12px var(--font-ui); color: var(--text-2); text-align: center; }
.rv .rl { font: var(--type-meta); color: var(--text-2); display: block; }
.rv .rvv { font: var(--type-card-title); display: block; }
.rv .rvv.mono { font: var(--type-field-mono); font-size: 20px; letter-spacing: .03em; }
.rv .marker { padding-left: 0; }
.rv .edit { font: var(--type-label); color: var(--accent-ink); padding: 0 12px; }

/* Print */
.saved { display: inline-flex; align-items: center; gap: 4px; font: var(--type-tag); color: var(--good-ink); }
.saved-line { display: flex; flex-direction: column; gap: 4px; }
/* The tag: 70 mm long, 32 mm printable height on 36 mm tape (PT-P910BT, 360 dpi) */
.tag-plate { width: 100%; aspect-ratio: 70 / 32; background: var(--paper); border-radius: var(--radius-plate); display: flex; gap: 12px; padding: 10px; color: #111; box-shadow: 0 0 0 1px var(--divider); }
.tag-plate .qr { width: 144px; height: 144px; flex: none; }
.tag-plate .qr path { fill: #111; }
.tag-plate .tl { display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; font: 600 14px/18px var(--font-ui); }
.tag-plate .tl .m { font: 700 13px/17px var(--font-mono); white-space: nowrap; }
.tag-cap { font: var(--type-meta); color: var(--text-2); margin-top: -16px; }
.rows { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); }
.prow { width: 100%; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 12px; min-height: 64px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--divider); text-align: left; position: relative; isolation: isolate; }
.prow:last-child { border-bottom: 0; }
.prow::before { content: ""; position: absolute; inset: 0; z-index: var(--z-under); background: var(--surface); opacity: 0; transition: opacity var(--dur-press) var(--ease-standard); }
button.prow:active::before { opacity: 1; }
.prow > .ms:first-child { color: var(--text-2); }
.prow .pl { font: var(--type-label); display: block; }
.prow .pv { font: var(--type-tag); color: var(--text-2); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.prow .pv.good { color: var(--good-ink); }
.prow .chev { color: var(--text-2); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; }
.stepper output { min-width: 28px; text-align: center; font: var(--type-big-number); font-variant-numeric: tabular-nums; }
.did { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.did h3 { font: var(--type-section); }
.did .acts { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.again { align-self: flex-start; margin: -12px 0 -12px -12px; }

/* Bottom bar: Back + primary, pinned (rides above the keyboard in the app) */
.ci-bottom { flex: none; display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--divider); }
.ci-bottom.one { grid-template-columns: 1fr; }
.ci-bottom .btn.raised { min-width: 112px; }
.keyboard { flex: none; height: 260px; padding: 8px 4px 0; background: #2B2C2F; display: flex; flex-direction: column; gap: 10px; }
.kb-row { display: flex; gap: 6px; justify-content: center; }
.kb-row span { width: 33px; height: 44px; border-radius: 6px; background: #46474B; }
.kb-row .w { width: 88px; } .kb-row .sp { width: 180px; }
.kb-label { text-align: center; font: var(--type-meta); color: var(--text-2); }

/* Bottom sheets: Leave without saving, Print later */
.scrim { position: absolute; inset: 0; z-index: 8; background: var(--scrim-modal); display: flex; align-items: flex-end; }
.sheet { width: 100%; border-radius: 16px 16px 0 0; background: var(--surface-raised); border-top: 1px solid var(--border-strong); padding: 20px 16px 50px; display: flex; flex-direction: column; gap: 10px; animation: up var(--dur-sheet) var(--ease-out); }
@keyframes up { from { translate: 0 100%; } }
.sheet h2 { font: var(--type-section); }
.sheet h2:focus { outline: none; }
.sheet p { color: var(--text); }
.sheet .acts { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 10px; }

@media (prefers-reduced-motion: reduce) { .qchip:active, .type-card:active, .wide:active { transform: none; } .sheet { animation: fade 120ms linear; } @keyframes fade { from { opacity: 0; } } }
</style>
</head>

</aside>
<main class="stage" id="stage"></main>

    ${head("Price", "The asking price. It isn't printed on the tag.")}
    <div class="group">
      ${well({ id: "price", tid: "checkin.price", value: "21,999", prefix: "$", attrs: ' inputmode="decimal" aria-labelledby="step-h"' })}
      <div><button class="qchip" type="button" data-testid="checkin.price.later" aria-pressed="false">${ic("schedule", "ms-20")}Add the price later</button></div>
    </div>`;
}
function reviewStep() {
  const rows = [
    ["vin", "VIN", VIN, { mono: true }], ["type", "Type", "Side-by-side", { thumb: "Side-by-side" }],
    ["make", "Make and model", "Polaris RZR XP 1000", { marker: true }], ["year", "Year and colour", "2026, Gray", { marker: true }], ["price", "Price", "$21,999", {}],
  ];
  return `
    <div class="head"><h2 class="step-h" id="step-h" tabindex="-1">Check it over</h2>
      <p class="help">Check it against the unit. Everything except the price prints on the tag.</p>
      <p class="help" style="display:flex;align-items:center;gap:6px">${ic("person", "ms-20")}Checking in as Dale</p></div>
    <div class="review">${rows.map(([k, l, v, o]) => `
      <button class="rv" type="button" data-edit="${k}" data-testid="checkin.review.edit.${k}" aria-label="${l === "VIN" ? "V I N" : l}: ${o.mono ? v.split("").join(" ") : v}. Edit">
        ${o.thumb ? `<span class="thumb" aria-hidden="true">${o.thumb} image</span>` : "<span></span>"}
        <span><span class="rl">${l}</span><span class="rvv${o.mono ? " mono" : ""}">${v}</span>${o.marker ? marker : ""}</span>
        <span class="edit" aria-hidden="true">Edit</span>
      </button>`).join("")}
    </div>
    <div class="group"><label class="field-label" for="f-notes">Notes <span class="opt">(optional)</span></label>
      <div class="well"><textarea id="f-notes" data-testid="checkin.notes" placeholder="Condition, upgrades, anything the next person should know"></textarea></div></div>`;
}
const TAG = `<div class="tag-plate" role="img" aria-label="Tag preview: 2026 Polaris RZR XP 1000, Gray, Side-by-side, V I N ${VIN.split("").join(" ")}, I D 6 M D Q 1 K X A">${CODES.tag}
  <div class="tl"><span>2026 Polaris RZR XP 1000</span><span>Gray</span><span>Side-by-side</span><span class="m">VIN ${VIN}</span><span class="m">ID 6MDQ1KXA</span></div></div>`;
function printStep(st) {
  const printed = st === "printed";
  const printerRow = st === "print-none" || st === "did-print"
    ? `<span><span class="pl">No printer paired</span><span class="pv">Pair one, or send the tag to the printer's own app.</span></span>`
    : `<span><span class="pl">Brother PT-P910BT</span><span class="pv good">${ic("check_circle", "ms-16")}${printed ? "Printed." : "Ready. 36 mm tape loaded."}</span></span>`;
  const rows = `
    <div class="rows">
      <button class="prow" type="button" data-testid="checkin.print.printer" data-go="pair or change the printer (asks for Bluetooth on first use)">${ic("print")}${printerRow}<span class="chev">${ic("chevron_right")}</span></button>
      <button class="prow" type="button" data-testid="checkin.print.size" data-go="label size">${ic("straighten")}<span><span class="pl">Label size</span><span class="pv">${st === "print-none" || st === "did-print" ? "70 mm long, this phone's setting" : "36 mm tape, 70 mm long, read from the printer"}</span></span><span class="chev">${ic("chevron_right")}</span></button>
      <div class="prow">${ic("content_copy")}<span><span class="pl" id="copies-l">Copies</span><span class="pv">One per box</span></span>
        <div class="stepper" role="group" aria-labelledby="copies-l"><button class="raised" type="button" aria-label="One fewer copy" data-step="-1" disabled>${ic("remove")}</button><output data-testid="checkin.print.copies" aria-live="polite">1</output><button class="raised" type="button" aria-label="One more copy" data-step="1">${ic("add")}</button></div></div>
    </div>`;
  const savedLine = `<div class="saved-line" aria-live="polite"><span class="saved">${ic("check_circle", "ms-16")}Saved as Incoming. Tag ID 6MDQ1KXA.</span></div>`;
  if (printed) return `
    ${head("Tag printed", "Stick it on the box, scan it, then tap Move to In stock.")}
    ${savedLine}
    ${TAG}
    <button class="text-btn again" type="button" data-act="print-again" data-testid="checkin.print.again">${ic("print", "ms-20")}Print again</button>`;
  if (st === "did-print") return `
    ${head("Print the tag")}
    ${savedLine}
    ${TAG}
    <section class="did" aria-labelledby="did-h"><h3 id="did-h" tabindex="-1">Did the tag print?</h3>
      <p>The tag went to the printer app. It can't tell InScan whether it printed.</p>
      <div class="acts"><button class="btn raised" type="button" data-act="share" data-testid="checkin.print.sendAgain">Send again</button><button class="btn btn-primary" type="button" data-act="printed" data-testid="checkin.print.yes">Yes, it printed</button></div>
    </section>`;
  return `
    ${head("Print the tag")}
    ${savedLine}
    ${TAG}
    <p class="tag-cap">Actual proportions: 70 × 32 mm print area on 36 mm tape.</p>
    ${rows}`;
}

function bodyFor(st) {
  if (st.startsWith("vin")) return vinStep(st);
  if (st === "type") return typeStep();
  if (st === "make" || st === "make-miss" || st === "leave") return makeStep(st);
  if (st === "year" || st === "edit") return yearStep();
  if (st === "price") return priceStep();
  if (st === "review") return reviewStep();
  return printStep(st === "print-later" ? "print-ready" : st);
}
const bar = (left, right) => `<div class="ci-bottom${left ? "" : " one"}">${left || ""}${right}</div>`;
const backBtn = `<button class="btn raised" type="button" data-act="back" data-testid="checkin.back">Back</button>`;
function bottomFor(st) {
  if (st === "vin-dupe") return bar(backBtn, `<button class="btn btn-primary" type="button" data-go="stock/9QF3M2ZD" data-testid="checkin.vin.openExisting">Open that unit</button>`);
  if (st === "review") return bar(backBtn, `<button class="btn btn-primary" type="button" data-act="save" data-testid="checkin.save">Save and print tag</button>`);
  if (st === "edit") return bar(`<button class="btn raised" type="button" data-act="to-review" data-testid="checkin.back">Back</button>`, `<button class="btn btn-primary" type="button" data-act="to-review" data-testid="checkin.next">Back to review</button>`);
  if (st === "print-none") return bar("", `<button class="btn btn-primary" type="button" data-act="share" data-testid="checkin.print.go">${ic("ios_share", "ms-20")}Send to printer app</button>`);
  if (st === "print-ready" || st === "print-later") return bar("", `<button class="btn btn-primary" type="button" data-act="printed" data-testid="checkin.print.go">${ic("print", "ms-20")}Print tag</button>`);
  if (st === "did-print") return "";
  if (st === "printed") return bar(`<button class="btn raised" type="button" data-act="restart" data-testid="checkin.print.another">Check in another</button>`, `<button class="btn btn-primary" type="button" data-go="Scan, expecting tag 6MDQ1KXA" data-testid="checkin.print.scan">${ic("qr_code_scanner", "ms-20")}Scan the tag</button>`);
  // Step 1 has no Back: Cancel does that job
  return bar(STEP[st] === 1 ? "" : backBtn, `<button class="btn btn-primary" type="button" data-act="next" data-testid="checkin.next">Next</button>`);
}
const KB = `<div class="keyboard" aria-hidden="true">${[10, 9, 7].map((n, r) => `<div class="kb-row">${r === 2 ? '<span class="w"></span>' : ""}${"<span></span>".repeat(n)}${r === 2 ? '<span class="w"></span>' : ""}</div>`).join("")}<p class="kb-label">System keyboard, autocorrect off</p></div>`;
function topLeft(st) {
  if (st === "printed" || st === "did-print") return `<button class="text-btn" type="button" data-act="done" data-testid="checkin.print.done">Done</button>`;
  if (PRINT.has(st)) return `<button class="text-btn" type="button" data-act="later" data-testid="checkin.print.later">Print later</button>`;
  return `<button class="text-btn" type="button" data-act="cancel" data-testid="checkin.cancel">Cancel</button>`;
}
function phoneHTML(st) {
  const printing = PRINT.has(st), n = STEP[st], sheet = st === "leave" || st === "print-later", inert = sheet ? " inert" : "";
  return `
  <div class="phone" data-state="${st}">
    <div class="sys-top" aria-hidden="true"><span>9:41</span><span class="island"></span><span>100%</span></div>
    <header class="ci-top"${inert}>${topLeft(st)}<h1>Check in a unit</h1><span class="ci-step" data-testid="checkin.step">${printing ? "" : `Step ${n} of 6`}</span></header>
    <div class="progress" aria-hidden="true"><span style="transform:scaleX(${printing ? 1 : (n / 6).toFixed(3)})"></span></div>
    <main class="body"${inert}>${bodyFor(st)}</main>
    ${inert ? bottomFor(st).replace('<div class="ci-bottom', '<div inert class="ci-bottom') : bottomFor(st)}
    ${st === "make" ? KB : `<div class="sys-bottom" aria-hidden="true"></div>`}
    ${st === "leave" ? `
    <div class="scrim"><section class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="sh-h" aria-describedby="sh-p">
      <h2 id="sh-h" tabindex="-1">Leave without saving?</h2>
      <p id="sh-p">Nothing is saved yet. What you've entered for this unit will be lost.</p>
      <div class="acts"><button class="btn raised" type="button" data-testid="checkin.leave.go" data-go="back to where Check in was opened">Leave</button><button class="btn btn-primary" type="button" data-act="keep" data-testid="checkin.leave.keep">Keep editing</button></div>
    </section></div>` : ""}
    ${st === "print-later" ? `
    <div class="scrim"><section class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="sh-h" aria-describedby="sh-p">
      <h2 id="sh-h" tabindex="-1">Print the tag later?</h2>
      <p id="sh-p">The unit is saved as Incoming. Until it has a tag it shows as "No tag yet" on Home and on its own page.</p>
      <div class="acts"><button class="btn raised" type="button" data-testid="checkin.later.go" data-go="the new unit, Incoming, No tag yet">Print later</button><button class="btn btn-primary" type="button" data-act="keep-print" data-testid="checkin.later.print">Print now</button></div>
    </section></div>` : ""}
  </div>`;
}

const params = new URLSearchParams(location.search);
if (params.has("shot")) document.body.classList.add("shot");
let state = params.get("state") || location.hash.slice(1) || "vin";
if (!STATES.some(s => s.key === state)) state = "vin";
const stage = document.getElementById("stage"), route = document.getElementById("route");
function fit() {
  if (document.body.classList.contains("shot")) return;
  const box = stage.querySelector(".fit"); if (!box) return;
  const r = stage.getBoundingClientRect();
  const availH = window.innerWidth > 760 ? window.innerHeight - 48 : Infinity;
  const s = Math.min(1, availH / 874, (r.width - 32) / 402);
  box.style.width = 402 * s + "px"; box.style.height = 874 * s + "px";
  box.firstElementChild.style.transform = `scale(${s})`;
}
function render(focus) {
  document.getElementById("states").innerHTML = STATES.map(s => s.group ? `<p class="group">${s.group}</p>`
    : `<button type="button" data-state="${s.key}" aria-pressed="${s.key === state}">${s.label}</button>`).join("");
  stage.innerHTML = `<div class="fit">${phoneHTML(state)}</div>`;
  fit();
  try { history.replaceState(null, "", location.search + "#s-" + state); } catch {}
  if (focus && !document.body.classList.contains("shot")) stage.querySelector(state === "leave" || state === "print-later" ? "#sh-h" : state === "did-print" ? "#did-h" : "#step-h")?.focus();
}
function go(next) { state = next; route.textContent = ""; render(true); }
document.addEventListener("click", e => {
  const s = e.target.closest(".states button"); if (s) { go(s.dataset.state); return; }
  const chip = e.target.closest(".qchip[data-chip]");
  if (chip) { chip.parentElement.querySelectorAll(".qchip").forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
    const input = chip.closest(".group").querySelector("input"); if (input) input.value = chip.dataset.chip; return; }
  const t = e.target.closest(".qchip:not([data-chip])"); if (t) { t.setAttribute("aria-pressed", String(t.getAttribute("aria-pressed") !== "true")); return; }
  const card = e.target.closest(".type-card"); if (card) { card.parentElement.querySelectorAll(".type-card").forEach(c => c.setAttribute("aria-checked", String(c === card))); return; }
  const seg = e.target.closest(".seg button"); if (seg) { seg.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", String(b === seg))); return; }
  const stp = e.target.closest("[data-step]"); if (stp) { const g = stp.parentElement, o = g.querySelector("output"); const v = Math.min(5, Math.max(1, +o.textContent + +stp.dataset.step)); o.textContent = v; g.querySelector('[data-step="-1"]').disabled = v === 1; g.querySelector('[data-step="1"]').disabled = v === 5; return; }
  const ed = e.target.closest("[data-edit]"); if (ed) { go(ed.dataset.edit === "year" ? "edit" : ed.dataset.edit === "vin" ? "vin-ok" : ed.dataset.edit); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act, i = ORDER.indexOf(state === "vin" ? "vin-ok" : state === "make-miss" ? "make" : state);
    if (act === "next") go(state === "vin" ? "vin-ok" : ORDER[Math.min(i + 1, ORDER.length - 1)]);
    if (act === "back") go(i > 0 ? ORDER[i - 1] : "vin");
    if (act === "to-review") go("review");
    if (act === "save") { a.disabled = true; go("print-ready"); }   // one tap saves once; the ID was made at step 1
    if (act === "printed") go("printed");
    if (act === "share") go("did-print");
    if (act === "cancel") go("leave");
    if (act === "keep") go("make");
    if (act === "later") go("print-later");
    if (act === "keep-print") go("print-ready");
    if (act === "restart") go("vin");
    if (act === "print-again") go("print-ready");
    if (act === "done") route.textContent = "In the app this goes to: the new unit, Incoming";
    return;
  }
  const g = e.target.closest("[data-go]"); if (g) route.textContent = `In the app this goes to: ${g.dataset.go}`;
});
document.addEventListener("input", e => { if (e.target.id === "f-vin") stage.querySelector("#vin-count").textContent = `${e.target.value.replace(/\s/g, "").length} of 17`; });
document.addEventListener("touchstart", () => {}, { passive: true });
window.addEventListener("resize", fit);
render();
</script>
</body>
</html>
