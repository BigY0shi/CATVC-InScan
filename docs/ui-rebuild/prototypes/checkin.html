<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InScan Check in</title>
<!--
  InScan: check in a unit and print its tag. Frame: iPhone 17 / 17 Pro, 402 x 874 pt, safe areas drawn.
  Spec: docs/ui-rebuild/checkin-ui-spec.md. The spec wins where this file differs.
  Tokens: inscan-base.css. 1 CSS px = 1 pt / dp. The state list on the left is mockup chrome.
  ?shot&state=<key> renders the phone alone. The system keyboard is not drawn.
  The tag QR code is real: LabelPayload format for the sample unit, generated, not drawn.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="inscan-base.css">
<style>
.phone > .sys-top { background: var(--surface); }
.phone > .sys-bottom { background: var(--surface); }

/* Top bar: Cancel, title, step count */
.ci-top { flex: none; height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px 0 4px; background: var(--surface); }
.ci-top h1 { font: var(--type-section); text-align: center; }
.ci-top .text-btn { justify-self: start; }
.ci-step { justify-self: end; font: var(--type-meta); color: var(--text-2); padding-right: 8px; }
.progress { flex: none; height: 4px; background: var(--divider); }
.progress span { display: block; height: 100%; background: var(--accent); transition: width var(--dur-sheet) var(--ease-standard); }

.body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.body::-webkit-scrollbar { display: none; }
.step-h { font: var(--type-screen-title); }
.help { color: var(--text-2); margin-top: -8px; }

/* Fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font: var(--type-label); color: var(--text); }
.opt { color: var(--text-2); font-weight: 400; }
.well { min-height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 16px; border-radius: 12px; background: var(--well-fill); border: 1px solid var(--border-strong); box-shadow: var(--well-shadow); cursor: text; flex: 1; min-width: 0; }
.well:focus-within { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.well input, .well textarea { flex: 1; min-width: 0; background: none; border: 0; outline: none; font: var(--type-body); color: var(--text); padding: 0; }
.well input { height: 54px; }
.well textarea { resize: none; padding: 14px 0; min-height: 84px; }
.well input::placeholder, .well textarea::placeholder { color: var(--text-2); opacity: 1; }
.well.mono input { font: 500 20px/26px var(--font-mono); letter-spacing: 0; text-transform: uppercase; }
.well.mono input::placeholder { text-transform: none; font: var(--type-body); }
.well .prefix { font: var(--type-body); color: var(--text-2); }
.row-field { display: flex; gap: 12px; align-items: stretch; }
.scan-mini { flex: none; min-width: 96px; height: 56px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: var(--type-label); padding: 0 14px; }
.scan-mini .ms { color: var(--accent-ink); }
.under { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 24px; }
.count { font: var(--type-meta); color: var(--text-2); font-variant-numeric: tabular-nums; padding-left: 4px; }
.under .text-btn { margin: -12px -12px -12px 0; }
.marker { display: inline-flex; align-items: center; gap: 4px; font: var(--type-meta); color: var(--text-2); padding-left: 4px; }
.marker .ms { color: var(--info-ink); }

/* Quick-pick chips (pressable, so raised) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { min-height: 48px; padding: 0 16px; border-radius: 24px; display: inline-flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--text);
  background: var(--surface-raised); border: 1px solid var(--border-strong); box-shadow: var(--chip-shadow); transition: transform 90ms var(--ease-out); }
.qchip:active { background: var(--pressed-fill); box-shadow: var(--pressed-shadow); transform: scale(.985); transition-duration: var(--dur-scale); }
.qchip[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-tint); }
.qchip .ms { color: inherit; }

/* Result lines and banners */
.line { display: flex; gap: 8px; align-items: flex-start; font: var(--type-body); color: var(--text); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; font: var(--type-body); color: var(--text); }
.banner.warn { background: var(--warn-tint); } .banner.warn > .ms { color: var(--warn-ink); }
.banner.info { background: var(--info-tint); } .banner.info > .ms { color: var(--info-ink); }
.check-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 4px; font: var(--type-body); cursor: pointer; }
.check-row input { appearance: none; width: 28px; height: 28px; margin: 0; border-radius: 6px; border: 2px solid var(--border-strong); background: var(--well-fill); display: grid; place-items: center; flex: none; cursor: pointer; }
.check-row input:checked { background: var(--accent); border-color: var(--accent); }
.check-row input:checked::after { content: "check"; font-family: "Material Symbols Rounded"; font-size: 22px; color: var(--on-accent); }
.check-row input:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.found { display: flex; flex-direction: column; gap: 10px; }

/* Type cards: 2 columns, raised (pressable). Selected: outline, tinted name plate, check badge. */
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-card { position: relative; border-radius: 12px; overflow: visible; display: flex; flex-direction: column; text-align: left; transition: transform 90ms var(--ease-out); }
.type-card:active { transform: scale(.97); transition-duration: var(--dur-scale); }
.type-card .img { height: 92px; margin: 8px 8px 0; border-radius: 8px; display: grid; place-items: center; text-align: center; font: var(--type-meta); color: var(--text-2); background: var(--bg); outline: 1px dashed var(--border-strong); outline-offset: -1px; }
.type-card .name { min-height: 44px; display: flex; flex-direction: column; justify-content: center; padding: 6px 12px 8px; font: var(--type-tile-label); }
.type-card .name small { font: var(--type-meta); color: var(--text-2); }
.type-card[aria-checked="true"] { border: 2px solid var(--accent-ink); }
.type-card[aria-checked="true"] .name { color: var(--accent-ink); }
.type-card .badge-check { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; display: none; place-items: center; background: var(--accent-tint); color: var(--accent-ink); }
.type-card[aria-checked="true"] .badge-check { display: grid; }

/* Review list: flat (information), Edit per section */
.review { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); }
.rv { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 10px 4px 10px 16px; border-bottom: 1px solid var(--divider); }
.rv:last-child { border-bottom: 0; }
.rv dt { font: var(--type-meta); color: var(--text-2); }
.rv dd { margin: 2px 0 0; font: var(--type-body); }
.rv dd.mono { font: var(--type-id); font-size: 16px; letter-spacing: .03em; }
.as-line { font: var(--type-meta); color: var(--text-2); display: flex; align-items: center; gap: 6px; }

/* Print: the real tag at true proportions (70 x 36 mm), then the rows */
.tag-plate { width: 100%; aspect-ratio: 70 / 36; background: #FAFAF7; border-radius: 6px; display: flex; gap: 12px; padding: 12px; color: #111; box-shadow: 0 0 0 1px var(--divider); }
.tag-plate .qr { width: 166px; height: 166px; flex: none; }
.tag-plate .qr path { fill: #111; }
.tag-plate .tl { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; font: 600 14px/18px var(--font-ui); }
.tag-plate .tl .m { font: 700 12.5px/17px var(--font-mono); letter-spacing: .01em; white-space: nowrap; }
.tag-cap { font: var(--type-meta); color: var(--text-2); margin-top: -8px; }
.rows { border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); }
.prow { width: 100%; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 12px; min-height: 64px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--divider); text-align: left; position: relative; isolation: isolate; }
.prow:last-child { border-bottom: 0; }
.prow::before { content: ""; position: absolute; inset: 0; z-index: var(--z-under); background: var(--surface); opacity: 0; transition: opacity var(--dur-press) var(--ease-standard); }
button.prow:active::before { opacity: 1; }
.prow > .ms:first-child { color: var(--text-2); }
.prow .pl { font: var(--type-label); }
.prow .pv { font: var(--type-meta); color: var(--text-2); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.prow .pv.good { color: var(--good-ink); } .prow .pv.warn { color: var(--warn-ink); }
.prow .chev { color: var(--text-2); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; }
.stepper output { min-width: 28px; text-align: center; font: var(--type-tile-label); font-variant-numeric: tabular-nums; }
.next-steps { display: flex; gap: 10px; align-items: flex-start; font: var(--type-body); }
.next-steps .ms { color: var(--good-ink); }

/* Bottom bar: Back + Next, pinned (rides above the keyboard in the app) */
.ci-bottom { flex: none; display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--divider); }
.ci-bottom.one { grid-template-columns: 1fr; }
.ci-bottom .btn.raised { min-width: 112px; }

/* Leave without saving */
.scrim { position: absolute; inset: 0; z-index: 8; background: rgb(0 0 0 / .62); display: grid; place-items: center; padding: 24px; }
.dialog { width: 100%; max-width: 354px; border-radius: 16px; background: var(--surface-raised); border: 1px solid var(--border-strong); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.dialog h2 { font: var(--type-section); }
.dialog p { color: var(--text); }
.dialog .acts { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 10px; }

@media (prefers-reduced-motion: reduce) { .qchip:active, .type-card:active { transform: none; } }
</style>
</head>

  <div class="states" id="states"></div>

</aside>

function vinStep(st) {
  const v = st === "vin" ? "" : st === "vin-fail" ? VIN_BAD : st === "vin-dupe" ? "1HFTE40A2R4733158" : VIN_OK;
  let result = "";
  if (st === "vin-ok") result = `
    <p class="line">${ic("check_circle", "ms-20 ink-good")}VIN check digit passes.</p>
    <p class="banner info">${ic("barcode", "ms-20")}<span>Filled in from the VIN: 2026, Polaris, RZR XP 1000, Side-by-side. Check them on the next steps.</span></p>`;
  if (st === "vin-fail") result = `
    <p class="banner warn">${ic("warning", "ms-20")}<span>This VIN doesn't add up (the 9th character should be 9). Check it against the frame, or tick the box if it matches exactly.</span></p>
    <label class="check-row"><input type="checkbox" data-testid="checkin.vin.frameMatch">VIN matches the frame exactly</label>`;
  if (st === "vin-dupe") result = `
    <div class="found">
      <p class="line">${ic("info", "ms-20 ink-info")}Already checked in. Open it instead of checking it in twice.</p>
      <button class="rec" type="button" data-testid="checkin.vin.existing" data-go="stock/9QF3M2ZD">
        <span class="rec-img" aria-hidden="true">Two wheels image</span>
        <span class="rec-body"><span class="rec-line1"><span class="uid">9QF3M2ZD</span><span class="tag ink-good">${ic("check_circle", "ms-16")}In stock</span></span>
        <span class="rec-name">2025 Honda CRF250F</span><span class="rec-meta">Checked in by Ray on Oct 14</span></span>
        <span class="rec-chev">${ic("chevron_right")}</span>
      </button>
    </div>`;
  const n = v.length;
  return `
    <h2 class="step-h" id="step-h" tabindex="-1">VIN or serial number</h2>
    <p class="help">Scan the VIN barcode, or type it. Go-karts and some pit bikes have a serial number instead.</p>

      <label for="f-vin">VIN or serial</label>
      <div class="row-field">
        <div class="well mono"><input id="f-vin" data-testid="checkin.vin.field" value="${v}" placeholder="Type it here" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-describedby="vin-count"></div>

    <p class="banner info">${ic("info", "ms-20")}<span>These details print on the tag. Check them against the unit.</span></p>
    <dl class="review">${rows.map(([k, l, v, mono]) => `
      <div class="rv"><div><dt>${l}</dt><dd${mono ? ' class="mono"' : ""}>${v}</dd></div><button class="text-btn" type="button" data-edit="${k}" data-testid="checkin.review.edit.${k}" aria-label="Edit ${l.toLowerCase()}">Edit</button></div>`).join("")}
    </dl>
    <div class="field"><label for="f-notes">Notes <span class="opt">(optional)</span></label>
      <div class="well"><textarea id="f-notes" data-testid="checkin.notes" placeholder="Condition, upgrades, anything the next person should know"></textarea></div></div>
    <p class="as-line">${ic("person", "ms-16")}Checking in as Dale</p>`;
}
const TAG = `<div class="tag-plate" role="img" aria-label="Tag preview: 2026 Polaris RZR XP 1000, Gray, Side-by-side, VIN ${VIN_OK}, ID 6 M D Q 1 K X A">${CODES.tag}
  <div class="tl"><span>2026 Polaris RZR XP 1000</span><span>Gray</span><span>Side-by-side</span><span class="m">VIN ${VIN_OK}</span><span class="m">ID 6MDQ1KXA</span></div></div>`;
function printStep(st) {
  const printer = st === "print-none"
    ? `<span class="pl">No printer paired</span><span class="pv">Pair one, or send the tag to the printer's own app.</span>`
    : `<span class="pl">Brother PT-P910BT</span><span class="pv good">${ic("check_circle", "ms-16")}${st === "printed" ? "Printed." : "Ready. 36 mm tape loaded."}</span>`;
  return `
    <h2 class="step-h" id="step-h" tabindex="-1">${st === "printed" ? "Tag printed" : "Print the tag"}</h2>
    ${TAG}
    <p class="tag-cap">Shown at its real proportions, 70 × 36 mm.</p>
    ${st === "printed" ? `<p class="next-steps">${ic("check_circle")}<span>Saved as Incoming. Stick the tag on the box, then scan it to move the unit to In stock.</span></p>` : ""}
    <div class="rows">
      <button class="prow" type="button" data-testid="checkin.print.printer" data-go="pair or change the printer">${ic("print")}<span>${printer}</span><span class="chev">${ic("chevron_right")}</span></button>
      <button class="prow" type="button" data-testid="checkin.print.size" data-go="label size">${ic("straighten")}<span><span class="pl">Label size</span><span class="pv">70 × 36 mm tape${st === "print-none" ? ", this phone's setting" : ", read from the printer"}</span></span><span class="chev">${ic("chevron_right")}</span></button>
      <div class="prow">${ic("content_copy")}<span><span class="pl" id="copies-l">Copies</span><span class="pv">Two for a unit in two boxes</span></span>
        <div class="stepper" role="group" aria-labelledby="copies-l"><button class="raised" type="button" aria-label="One fewer copy" data-step="-1">${ic("remove")}</button><output data-testid="checkin.print.copies">1</output><button class="raised" type="button" aria-label="One more copy" data-step="1">${ic("add")}</button></div></div>
    </div>`;
}

function bodyFor(st) {
  if (st.startsWith("vin")) return vinStep(st);
  if (st === "type") return typeStep();
  if (st === "make" || st === "leave") return makeStep();
  if (st === "year") return yearStep();
  if (st === "price") return priceStep();
  if (st === "review") return reviewStep();
  return printStep(st);
}
function bottomFor(st) {
  if (st === "vin-dupe") return `<div class="ci-bottom"><button class="btn raised" type="button" data-act="back" data-testid="checkin.back">Back</button><button class="btn btn-primary" type="button" data-go="stock/9QF3M2ZD" data-testid="checkin.vin.openExisting">Open that unit</button></div>`;
  if (st === "review") return `<div class="ci-bottom"><button class="btn raised" type="button" data-act="back" data-testid="checkin.back">Back</button><button class="btn btn-primary" type="button" data-act="save" data-testid="checkin.save">Save and print tag</button></div>`;
  if (st === "print-none") return `<div class="ci-bottom one"><button class="btn btn-primary" type="button" data-act="printed" data-testid="checkin.print.go">${ic("ios_share", "ms-20")}Send to printer app</button></div>`;
  if (st === "print-ready") return `<div class="ci-bottom one"><button class="btn btn-primary" type="button" data-act="printed" data-testid="checkin.print.go">${ic("print", "ms-20")}Print tag</button></div>`;
  if (st === "printed") return `<div class="ci-bottom one"><button class="btn btn-primary" type="button" data-go="Scan, then Found, still Incoming, then Move to In stock" data-testid="checkin.print.scan">${ic("qr_code_scanner", "ms-20")}Scan the tag</button></div>`;
  return `<div class="ci-bottom"><button class="btn raised" type="button" data-act="back" data-testid="checkin.back">Back</button><button class="btn btn-primary" type="button" data-act="next" data-testid="checkin.next">Next</button></div>`;
}
function phoneHTML(st) {
  const printing = st.startsWith("print") || st === "printed";
  const n = STEP[st];
  return `
  <div class="phone" data-state="${st}">
    <div class="sys-top" aria-hidden="true"><span>9:41</span><span class="island"></span><span>100%</span></div>
    <header class="ci-top"${st === "leave" ? " inert" : ""}>
      <button class="text-btn" type="button" data-act="${printing ? "done" : "cancel"}" data-testid="${printing ? "checkin.print.done" : "checkin.cancel"}">${printing ? "Done" : "Cancel"}</button>
      <h1>Check in a unit</h1>
      <span class="ci-step" data-testid="checkin.step">${printing ? "Saved" : `Step ${n} of 6`}</span>
    </header>
    <div class="progress" aria-hidden="true"${st === "leave" ? " inert" : ""}><span style="width:${printing ? 100 : Math.round((n - 1) / 6 * 100)}%"></span></div>
    <main class="body"${st === "leave" ? " inert" : ""}>${bodyFor(st)}</main>
    ${st === "leave" ? bottomFor(st).replace("<div class=\"ci-bottom\"", "<div inert class=\"ci-bottom\"") : bottomFor(st)}
    <div class="sys-bottom" aria-hidden="true"></div>
    ${st === "leave" ? `
    <div class="scrim"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="leave-h" aria-describedby="leave-p">
      <h2 id="leave-h">Leave without saving?</h2>
      <p id="leave-p">Nothing is saved yet. What you've entered for this unit will be lost.</p>
      <div class="acts"><button class="btn raised" type="button" data-testid="checkin.leave.go" data-go="back to where Check in was opened">Leave</button><button class="btn btn-primary" type="button" data-act="keep" data-testid="checkin.leave.keep">Keep editing</button></div>
    </section></div>` : ""}
  </div>`;
}

const params = new URLSearchParams(location.search);
if (params.has("shot")) document.body.classList.add("shot");
let state = params.get("state") || location.hash.slice(1) || "vin";
if (!STATES.some(s => s.key === state)) state = "vin";
const stage = document.getElementById("stage"), route = document.getElementById("route");
function fit() {
  if (document.body.classList.contains("shot")) return;
  const box = stage.querySelector(".fit"); if (!box) return;
  const r = stage.getBoundingClientRect();
  const availH = window.innerWidth > 760 ? window.innerHeight - 48 : Infinity;
  const s = Math.min(1, availH / 874, (r.width - 32) / 402);
  box.style.width = 402 * s + "px"; box.style.height = 874 * s + "px";
  box.firstElementChild.style.transform = `scale(${s})`;
}
function render(focus) {
  document.getElementById("states").innerHTML = STATES.map(s => s.group ? `<p class="group">${s.group}</p>`
    : `<button type="button" data-state="${s.key}" aria-pressed="${s.key === state}">${s.label}</button>`).join("");
  stage.innerHTML = `<div class="fit">${phoneHTML(state)}</div>`;
  fit();
  try { history.replaceState(null, "", location.search + "#" + state); } catch {}
  if (focus && !document.body.classList.contains("shot")) stage.querySelector(state === "leave" ? "#leave-h" : "#step-h")?.focus();
}
function go(next) { state = next; route.textContent = ""; render(true); }
let returnTo = null;
document.addEventListener("click", e => {
  const s = e.target.closest(".states button"); if (s) { returnTo = null; go(s.dataset.state); return; }
  const chip = e.target.closest(".qchip[data-chip]");
  if (chip) { chip.parentElement.querySelectorAll(".qchip").forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
    const input = chip.closest(".body").querySelectorAll(".field input")[[...chip.closest(".body").querySelectorAll(".chips")].indexOf(chip.parentElement)];
    if (input) input.value = chip.dataset.chip; return; }
  const t = e.target.closest(".qchip:not([data-chip])"); if (t) { t.setAttribute("aria-pressed", String(t.getAttribute("aria-pressed") !== "true")); return; }
  const card = e.target.closest(".type-card"); if (card) { card.parentElement.querySelectorAll(".type-card").forEach(c => c.setAttribute("aria-checked", String(c === card))); return; }
  const st = e.target.closest("[data-step]"); if (st) { const o = st.parentElement.querySelector("output"); o.textContent = Math.min(5, Math.max(1, +o.textContent + +st.dataset.step)); return; }
  const ed = e.target.closest("[data-edit]"); if (ed) { returnTo = "review"; go(ed.dataset.edit === "vin" ? "vin-ok" : ed.dataset.edit); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act, i = ORDER.indexOf(state === "vin" ? "vin-ok" : state);
    if (act === "next") { if (returnTo) { const r = returnTo; returnTo = null; go(r); } else if (state === "vin") go("vin-ok"); else go(ORDER[Math.min(i + 1, ORDER.length - 1)]); }
    if (act === "back") go(i > 0 ? ORDER[i - 1] : "vin");
    if (act === "save") go("print-ready");
    if (act === "printed") go("printed");
    if (act === "cancel") go("leave");
    if (act === "keep") go("make");
    if (act === "done") route.textContent = "In the app this goes to: the new unit, Incoming";
    return;
  }
  const g = e.target.closest("[data-go]"); if (g) route.textContent = `In the app this goes to: ${g.dataset.go}`;
});
document.addEventListener("input", e => { if (e.target.id === "f-vin") stage.querySelector("#vin-count").textContent = `${e.target.value.replace(/\s/g, "").length} of 17`; });
document.addEventListener("touchstart", () => {}, { passive: true });
window.addEventListener("resize", fit);
render();
</script>
</body>
</html>
